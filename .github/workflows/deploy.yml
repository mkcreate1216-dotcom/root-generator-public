name: Build and Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.agents/**'
      - 'AGENTS.md'
      - 'docs/**'
      - 'scripts/**'
      - 'README.md'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '.agents/**'
      - 'AGENTS.md'
      - 'docs/**'
      - 'scripts/**'
      - 'README.md'
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify specs & TypeScript
        run: npm run check

      - name: Build site
        run: npm run build

      - name: Deploy to Cloudflare Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name=tabi-ori --commit-dirty=true