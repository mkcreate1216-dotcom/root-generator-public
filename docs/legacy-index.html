<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>たびおり</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
      summary {
        list-style: none;
      }
      summary::-webkit-details-marker {
        display: none;
      }

      /* 日程タグ（day-tabs）との配置調整: スマホ時はカード全幅＋タイムライン側でTAGを吸収 */
      #app-wrapper {
        padding-left: 0.75rem;
        padding-right: 0.75rem;
        padding-top: 1rem;
        padding-bottom: 1rem;
      }
      @media (min-width: 640px) {
        #app-wrapper {
          padding-left: 1.5rem;
          /* デスクトップで十分な余白があるときは中央配置、狭くなって日程タグと重なりそうになったら右側が縮む */
          padding-right: max(1.5rem, calc(6.5rem - max(0px, (100vw - 64rem) / 2)));
          padding-top: 1.5rem;
          padding-bottom: 1.5rem;
        }
      }
      #day-tabs::-webkit-scrollbar {
        display: none;
      }
      #day-tabs {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* グローバル・ホバーメッセージ（ツールチップ: グレー背景に黒文字） */
      #app-tooltip {
        position: fixed;
        z-index: 9999;
        pointer-events: none;
        opacity: 0;
        transition: opacity 75ms ease;
        white-space: nowrap;
        font-size: 0.75rem;
        line-height: 1rem;
        font-weight: 500;
        padding: 0.35rem 0.65rem;
        border-radius: 0.375rem;
        background-color: #e2e8f0; /* グレー背景 (slate-200) */
        color: #0f172a; /* 黒文字 (slate-900) */
        border: 1px solid #cbd5e1; /* 境界線 (slate-300) */
        box-shadow: 0 4px 12px rgba(15, 23, 42, 0.12);
        top: -9999px;
        left: -9999px;
      }
      #app-tooltip.is-visible {
        opacity: 1;
      }
      #app-tooltip-arrow {
        position: absolute;
        width: 0;
        height: 0;
        border: 4px solid transparent;
        pointer-events: none;
      }

      /* 日程詳細（details）の開閉 chevron アイコンの回転アニメーション */
      details summary .day-chevron {
        transition: transform 200ms ease;
        transform: rotate(-90deg);
        transform-origin: center;
      }
      details[open] summary .day-chevron {
        transform: rotate(0deg);
      }
    </style>
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-900">
    <div id="app-wrapper" class="mx-auto w-full max-w-5xl">
      <div class="rounded-2xl border border-slate-200 bg-white shadow-sm">
      <header class="p-5 pb-0">
        <div class="flex flex-wrap items-start justify-between gap-3 sm:items-center">
          <div>
            <h1 class="text-2xl font-bold tracking-tight text-slate-900 sm:text-3xl">たびおり</h1>
            <p class="mt-1 text-sm text-slate-600">予定を縦糸に、想い出を横糸に。旅を織る。</p>
          </div>
          <div class="flex items-center gap-2" id="header-map-selector-container">
            <div
              id="map-selector-group"
              class="inline-flex items-center gap-1 rounded-lg border border-slate-300 bg-white p-1 text-xs font-medium text-slate-700 shadow-xs"
              role="radiogroup"
              aria-label="地図アプリ選択"
            >
              <span class="flex items-center gap-1 pl-1.5 pr-0.5 text-slate-500 select-none" title="地図アプリ選択">
                <i data-lucide="map" class="h-3.5 w-3.5 sm:h-4 sm:w-4"></i>
                <span class="text-xs font-medium text-slate-600">マップ</span>
              </span>
              <div class="inline-flex items-center rounded-md bg-slate-100 p-0.5">
                <label
                  class="map-type-label flex cursor-pointer items-center rounded px-2 py-1 text-xs font-medium transition-all select-none"
                  data-map-type="google"
                >
                  <input type="radio" name="map-type-radio" value="google" class="sr-only" />
                  <span>Google</span>
                </label>
                <label
                  class="map-type-label flex cursor-pointer items-center rounded px-2 py-1 text-xs font-medium transition-all select-none"
                  data-map-type="apple"
                >
                  <input type="radio" name="map-type-radio" value="apple" class="sr-only" />
                  <span>Apple</span>
                </label>
              </div>
            </div>
          </div>
        </div>
      </header>

      <section class="p-4 pt-2 sm:p-6 sm:pt-2">
        <div class="fixed right-1.5 sm:right-6 top-1/2 z-40 flex max-h-[85vh] flex-col items-center gap-2 overflow-y-auto p-1.5 sm:p-3" id="day-tabs" style="transform: translateY(-50%)"></div>

        <form id="add-spot-form" class="sticky top-0 z-30 mb-2 rounded-xl border border-slate-200/60 p-3 shadow-sm backdrop-blur-md sm:p-3.5" style="background-color: rgba(255, 255, 255, 0.95)">
          <div class="relative mb-2" id="trip-combobox-container">
            <label class="text-xs font-medium text-slate-500" for="trip-name-input">旅行名</label>
            <div class="relative mt-0.5 flex items-center">
              <input
                id="trip-name-input"
                type="text"
                placeholder="旅行名を入力"
                class="w-full rounded-lg border border-slate-300 bg-white py-1.5 pl-3 pr-9 text-sm font-bold text-slate-900 outline-none transition focus:border-slate-900 focus:ring-2 focus:ring-slate-200"
              />
              <button
                id="trip-combobox-toggle"
                type="button"
                aria-label="旅行一覧を表示"
                aria-haspopup="listbox"
                aria-expanded="false"
                class="absolute right-1 top-1/2 -translate-y-1/2 rounded-md p-1.5 text-slate-400 transition-colors duration-75 hover:bg-slate-100 hover:text-slate-700"
              >
                <i data-lucide="chevron-down" class="h-4 w-4"></i>
              </button>
            </div>
            <ul
              id="trip-combobox-menu"
              role="listbox"
              class="absolute left-0 right-0 z-50 mt-1 hidden max-h-60 overflow-y-auto rounded-lg border border-slate-200 bg-white py-1 shadow-lg"
            ></ul>
          </div>
          <label class="mb-1.5 block text-xs font-medium text-slate-700" for="new-spot-input">スポット・地点を追加</label>
          <div class="flex flex-wrap items-center gap-2">
            <input
              id="new-spot-input"
              type="text"
              placeholder="例: 浅草寺"
              class="min-w-[12rem] flex-1 rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm outline-none transition-colors duration-75 focus:border-slate-900 focus:ring-2 focus:ring-slate-200"
            />
            <div class="flex items-center gap-2">
              <select
                id="add-location-type-select"
                aria-label="追加する地点の種類"
                class="shrink-0 min-w-0 w-24 sm:w-28 rounded-lg border border-slate-300 bg-white px-2 py-2 text-xs font-medium text-slate-700 outline-none transition-colors duration-75 focus:border-slate-900 focus:ring-2 focus:ring-slate-200 sm:px-2.5 sm:text-sm cursor-pointer"
              >
                <option value="spot">スポット</option>
                <option value="departure">発着地点</option>
                <option value="accommodation">宿泊地</option>
              </select>
              <button
                id="add-spot-btn"
                type="submit"
                class="shrink-0 rounded-lg bg-slate-900 px-3 py-2 text-sm font-medium text-white transition-colors duration-75 hover:bg-slate-800 sm:px-4"
              >
                追加
              </button>
            </div>
          </div>
          <p id="add-type-note" class="mt-2 hidden text-xs text-slate-500"></p>
          <div id="add-accommodation-scope" class="mt-2 hidden flex flex-wrap items-center gap-2" role="group" aria-label="宿泊地の反映範囲">
            <span class="text-xs text-slate-500">反映範囲:</span>
            <button id="add-accommodation-scope-all" type="button" class="rounded-lg border border-slate-300 bg-white px-2.5 py-1 text-xs font-medium text-slate-700">以降すべて</button>
            <button id="add-accommodation-scope-today" type="button" class="rounded-lg border border-slate-300 bg-white px-2.5 py-1 text-xs font-medium text-slate-700">当日のみ</button>
          </div>
        </form>

        <div id="timeline" class="space-y-0 pb-[70vh] pr-[3.75rem] sm:pr-0"></div>

        <div id="endpoint-section" class="hidden mt-6 rounded-xl border border-slate-200 bg-slate-50 p-3 sm:p-4">
          <div id="departure-field">
            <label class="mb-2 block text-sm font-medium text-slate-700" for="departure-input">出発地点</label>
            <input
              id="departure-input"
              type="text"
              placeholder="例: 東京駅"
              class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm outline-none transition focus:border-slate-900 focus:ring-2 focus:ring-slate-200"
            />
          </div>
        </div>

        <div id="accommodation-section" class="hidden mt-6 rounded-xl border border-slate-200 bg-slate-50 p-3 sm:p-4">
          <label class="mb-2 block text-sm font-medium text-slate-700" for="accommodation-input">宿泊地</label>
          <div class="mb-3 flex gap-2" role="group" aria-label="宿泊地の変更範囲">
            <button id="accommodation-scope-all" type="button" class="rounded-lg border border-slate-300 bg-white px-3 py-2 text-xs font-medium text-slate-700">
              以降すべて
            </button>
            <button id="accommodation-scope-next-day" type="button" class="rounded-lg border border-slate-300 bg-white px-3 py-2 text-xs font-medium text-slate-700">
              当日・翌日だけ
            </button>
          </div>
          <input
            id="accommodation-input"
            type="text"
            placeholder="例: 京都駅周辺"
            class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm outline-none transition focus:border-slate-900 focus:ring-2 focus:ring-slate-200"
          />
          <p class="mt-2 text-xs text-slate-500">入力すると翌日の出発地点（先頭）にデフォルトで反映されます。</p>
        </div>
      </section>
      </div>
    </div>

    <script>
      const STORAGE_KEY = "travel-itinerary-mvp-v1";
      const MAP_TYPE_STORAGE_KEY = "travel-itinerary-map-type";

      function getStoredMapType() {
        try {
          const stored = localStorage.getItem(MAP_TYPE_STORAGE_KEY);
          if (stored === "apple" || stored === "google") return stored;
        } catch (e) {}
        return "google";
      }

      const state = {
        days: [],
        activeDayIndex: 0,
        mapType: getStoredMapType(),
        openRouteMenuIndex: null,
        accommodationUpdateScope: "all",
        departure: "",
        arrival: "",
        autoArrival: true,
        tripName: "",
        addLocationType: "spot",
        addAccommodationScope: "all"
      };

      const MAX_TRIPS = 3;
      const TRIPS_STORAGE_KEY = "travel-itinerary-trips-v1";
      let trips = [];
      let activeTripId = null;
      const dayTabsEl = document.getElementById("day-tabs");
      const timelineEl = document.getElementById("timeline");
      const tripNameInputEl = document.getElementById("trip-name-input");
      const tripComboboxContainerEl = document.getElementById("trip-combobox-container");
      const tripComboboxToggleEl = document.getElementById("trip-combobox-toggle");
      const tripComboboxMenuEl = document.getElementById("trip-combobox-menu");
      const tripSwitcherEl = document.getElementById("trip-switcher");
      const tripNewBtnEl = document.getElementById("trip-new-btn");
      const tripDeleteBtnEl = document.getElementById("trip-delete-btn");
      const newSpotInputEl = document.getElementById("new-spot-input");
      const addSpotFormEl = document.getElementById("add-spot-form");
      const addLocationTypeSelectEl = document.getElementById("add-location-type-select");
      const addTypeNoteEl = document.getElementById("add-type-note");
      const addAccommodationScopeEl = document.getElementById("add-accommodation-scope");
      const addAccommodationScopeAllEl = document.getElementById("add-accommodation-scope-all");
      const addAccommodationScopeTodayEl = document.getElementById("add-accommodation-scope-today");
      const endpointSectionEl = document.getElementById("endpoint-section");
      const departureFieldEl = document.getElementById("departure-field");
      const departureInputEl = document.getElementById("departure-input");
      const accommodationSectionEl = document.getElementById("accommodation-section");
      const accommodationInputEl = document.getElementById("accommodation-input");
      const accommodationScopeAllEl = document.getElementById("accommodation-scope-all");
      const accommodationScopeNextDayEl = document.getElementById("accommodation-scope-next-day");
      let accommodationDebounceId = null;
      let pendingAccommodationSync = null;
      let draggedSpot = null;
      const collapsedDays = new Set();
      let isScrollingToTab = false;
      let scrollTimeoutId = null;

      function createDay(dayNumber, prevAccommodation = "") {
        return {
          name: `Day ${dayNumber}`,
          spots: dayNumber === 1 ? [] : prevAccommodation ? [prevAccommodation] : [],
          accommodation: dayNumber === 1 ? "" : prevAccommodation,
          autoAccommodation: dayNumber !== 1,
          autoStart: dayNumber !== 1,
          autoStartSlot: dayNumber !== 1 && !!prevAccommodation,
          autoStartValue: dayNumber !== 1 && !!prevAccommodation ? prevAccommodation : ""
        };
      }

      function ensureValidState() {
        if (!Array.isArray(state.days) || state.days.length === 0) {
          state.days = [createDay(1)];
        }
        if (typeof state.activeDayIndex !== "number" || state.activeDayIndex < 0 || state.activeDayIndex >= state.days.length) {
          state.activeDayIndex = 0;
        }
      }

      function generateTripId() {
        return `trip-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
      }

      function createTripEntry(tripName) {
        return {
          id: generateTripId(),
          tripName: tripName || "",
          days: [createDay(1)],
          activeDayIndex: 0,
          departure: "",
          arrival: "",
          autoArrival: true,
          mapType: getStoredMapType()
        };
      }

      function sanitizeTrip(trip) {
        const sanitized = trip && typeof trip === "object" ? trip : {};
        sanitized.id = typeof sanitized.id === "string" && sanitized.id ? sanitized.id : generateTripId();
        sanitized.tripName = typeof sanitized.tripName === "string" ? sanitized.tripName : "";
        sanitized.mapType = sanitized.mapType === "apple" ? "apple" : sanitized.mapType === "google" ? "google" : getStoredMapType();
        sanitized.days = Array.isArray(sanitized.days) && sanitized.days.length ? sanitized.days : [createDay(1)];
        for (let i = 0; i < sanitized.days.length; i++) {
          const day = sanitized.days[i] || {};
          day.name = day.name || `Day ${i + 1}`;
          day.spots = Array.isArray(day.spots) ? day.spots : [];
          day.accommodation = typeof day.accommodation === "string" ? day.accommodation : "";
          day.autoAccommodation = typeof day.autoAccommodation === "boolean" ? day.autoAccommodation : i !== 0;
          day.autoStart = typeof day.autoStart === "boolean" ? day.autoStart : i !== 0;
          day.autoStartSlot = typeof day.autoStartSlot === "boolean" ? day.autoStartSlot : day.autoStart && day.spots.length > 0;
          day.autoStartValue = typeof day.autoStartValue === "string" ? day.autoStartValue : day.autoStartSlot ? day.spots[0] || "" : "";
          sanitized.days[i] = day;
        }
        sanitized.activeDayIndex =
          Number.isInteger(sanitized.activeDayIndex) && sanitized.activeDayIndex >= 0 && sanitized.activeDayIndex < sanitized.days.length ? sanitized.activeDayIndex : 0;
        sanitized.departure = typeof sanitized.departure === "string" ? sanitized.departure : "";
        sanitized.arrival = typeof sanitized.arrival === "string" ? sanitized.arrival : "";
        sanitized.autoArrival = typeof sanitized.autoArrival === "boolean" ? sanitized.autoArrival : !sanitized.arrival || sanitized.arrival === sanitized.departure;
        return sanitized;
      }

      function migrateLegacyTrip() {
        // 旧バージョン（単一旅程保存）からの移行
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return null;
          return sanitizeTrip(JSON.parse(raw));
        } catch {
          return null;
        }
      }

      function loadTrips() {
        try {
          const raw = localStorage.getItem(TRIPS_STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            trips = Array.isArray(parsed.trips) && parsed.trips.length ? parsed.trips.slice(0, MAX_TRIPS).map(sanitizeTrip) : [];
            if (!trips.length) trips = [createTripEntry("旅行1")];
            activeTripId = trips.some((t) => t.id === parsed.activeTripId) ? parsed.activeTripId : trips[0].id;
            return;
          }
        } catch {
          trips = [];
        }
        const legacy = migrateLegacyTrip();
        trips = [legacy || createTripEntry("旅行1")];
        activeTripId = trips[0].id;
      }

      function getActiveTrip() {
        return trips.find((t) => t.id === activeTripId) || trips[0];
      }

      function applyActiveTripToState() {
        const trip = getActiveTrip();
        activeTripId = trip.id;
        state.days = trip.days;
        state.activeDayIndex = trip.activeDayIndex;
        state.tripName = trip.tripName;
        state.departure = trip.departure;
        state.arrival = trip.arrival;
        state.autoArrival = trip.autoArrival;
        state.mapType = trip.mapType || getStoredMapType();
        state.openRouteMenuIndex = null;
        state.accommodationUpdateScope = "all";
        state.addLocationType = "spot";
        state.addAccommodationScope = "all";
      }

      function persistActiveTripFromState() {
        const trip = getActiveTrip();
        if (!trip) return;
        trip.days = state.days;
        trip.activeDayIndex = state.activeDayIndex;
        trip.tripName = state.tripName;
        trip.departure = state.departure;
        trip.arrival = state.arrival;
        trip.autoArrival = state.autoArrival;
        trip.mapType = state.mapType;
      }

      function saveTrips() {
        persistActiveTripFromState();
        localStorage.setItem(TRIPS_STORAGE_KEY, JSON.stringify({ trips, activeTripId }));
      }

      let isTripMenuOpen = false;

      function toggleTripMenu(force) {
        isTripMenuOpen = typeof force === "boolean" ? force : !isTripMenuOpen;
        if (tripComboboxMenuEl) {
          tripComboboxMenuEl.classList.toggle("hidden", !isTripMenuOpen);
        }
        if (tripComboboxToggleEl) {
          tripComboboxToggleEl.setAttribute("aria-expanded", String(isTripMenuOpen));
        }
        if (isTripMenuOpen) {
          renderTripComboboxMenu();
        }
      }

      function createNewTrip() {
        if (trips.length >= MAX_TRIPS) {
          alert(`旅行は最大${MAX_TRIPS}件までしか作成できません。`);
          return;
        }
        saveTrips();
        const newTrip = createTripEntry(`旅行${trips.length + 1}`);
        trips.push(newTrip);
        activeTripId = newTrip.id;
        applyActiveTripToState();
        saveTrips();
        render();
        if (tripNameInputEl) {
          tripNameInputEl.focus();
          tripNameInputEl.select();
        }
      }

      function deleteTrip(tripId) {
        if (trips.length <= 1) {
          alert("最後の1件の旅行は削除できません。");
          return;
        }
        const index = trips.findIndex((t) => t.id === tripId);
        if (index === -1) return;
        const targetTrip = trips[index];
        const displayName = targetTrip.tripName && targetTrip.tripName.trim() ? targetTrip.tripName : `旅行${index + 1}`;
        if (!confirm(`「${displayName}」を削除しますか？この操作は取り消せません。`)) {
          return;
        }
        trips.splice(index, 1);
        if (tripId === activeTripId) {
          activeTripId = trips[Math.max(0, index - 1)].id;
          applyActiveTripToState();
        }
        saveTrips();
        render();
      }

      function renderTripComboboxMenu() {
        if (!tripComboboxMenuEl) return;
        tripComboboxMenuEl.innerHTML = "";
        trips.forEach((trip, index) => {
          const item = document.createElement("li");
          const isSelected = trip.id === activeTripId;
          item.className = `flex cursor-pointer items-center justify-between gap-2 px-3 py-2 text-sm transition-colors duration-75 hover:bg-slate-100 ${
            isSelected ? "bg-slate-50 font-bold text-slate-900" : "text-slate-700"
          }`;
          item.setAttribute("role", "option");
          item.setAttribute("aria-selected", String(isSelected));

          const labelArea = document.createElement("div");
          labelArea.className = "flex min-w-0 flex-1 items-center gap-2";

          if (isSelected) {
            const check = document.createElement("i");
            check.setAttribute("data-lucide", "check");
            check.className = "h-4 w-4 shrink-0 text-slate-900";
            labelArea.appendChild(check);
          } else {
            const spacer = document.createElement("span");
            spacer.className = "h-4 w-4 shrink-0";
            labelArea.appendChild(spacer);
          }

          const label = document.createElement("span");
          label.className = "truncate";
          label.textContent = trip.tripName && trip.tripName.trim() ? trip.tripName : `旅行${index + 1}`;
          labelArea.appendChild(label);

          item.appendChild(labelArea);

          const deleteBtn = document.createElement("button");
          deleteBtn.type = "button";
          const displayName = trip.tripName && trip.tripName.trim() ? trip.tripName : `旅行${index + 1}`;
          deleteBtn.setAttribute("aria-label", `${displayName}を削除`);
          const singleTrip = trips.length <= 1;
          if (singleTrip) {
            deleteBtn.disabled = true;
            deleteBtn.className = "rounded-md p-1 text-slate-200 cursor-not-allowed shrink-0";
            deleteBtn.title = "最後の1件の旅行は削除できません";
          } else {
            deleteBtn.className = "rounded-md p-1 text-slate-400 hover:bg-red-50 hover:text-red-600 transition-colors duration-75 shrink-0";
            deleteBtn.title = `${displayName}を削除`;
            deleteBtn.addEventListener("click", (e) => {
              e.stopPropagation();
              deleteTrip(trip.id);
            });
          }
          deleteBtn.innerHTML = '<i data-lucide="x" class="h-3.5 w-3.5"></i>';
          item.appendChild(deleteBtn);

          item.addEventListener("click", (e) => {
            e.stopPropagation();
            if (trip.id !== activeTripId) {
              saveTrips();
              activeTripId = trip.id;
              applyActiveTripToState();
              saveTrips();
              render();
            }
            toggleTripMenu(false);
          });

          tripComboboxMenuEl.appendChild(item);
        });

        // 最下部に「新しい旅程を作成」を配置
        const separator = document.createElement("li");
        separator.className = "my-1 border-t border-slate-100";
        separator.setAttribute("role", "separator");
        tripComboboxMenuEl.appendChild(separator);

        const addActionItem = document.createElement("li");
        const addBtn = document.createElement("button");
        addBtn.type = "button";
        const isMaxTrips = trips.length >= MAX_TRIPS;
        addBtn.className = `flex w-full items-center gap-2 px-3 py-2 text-xs font-medium transition-colors duration-75 ${
          isMaxTrips
            ? "cursor-not-allowed text-slate-400"
            : "text-slate-700 hover:bg-slate-100 hover:text-slate-900"
        }`;
        addBtn.innerHTML = '<i data-lucide="plus" class="h-4 w-4 shrink-0"></i><span>新しい旅程を作成</span>';
        if (isMaxTrips) {

      function syncAutoStarts() {
        for (let i = 1; i < state.days.length; i++) {
          const previousAccommodation = (state.days[i - 1].accommodation || "").trim();
          const day = state.days[i];
          if (day.autoAccommodation) {
            day.accommodation = previousAccommodation;
          }
          if (day.autoStart) {
            if (previousAccommodation) {
              if (day.autoStartSlot) {
                if (day.spots.length === 0) {
                  day.spots.unshift(previousAccommodation);
                  day.autoStartSlot = true;
                  day.autoStartValue = previousAccommodation;
                } else {
                  const currentFirst = (day.spots[0] || "").trim();
                  const managedValue = (day.autoStartValue || "").trim();
                  if (managedValue && currentFirst !== managedValue) {
                    day.autoStart = false;
                    day.autoStartSlot = false;
                    day.autoStartValue = "";
                  } else if (!managedValue && currentFirst) {
                    day.autoStart = false;
                    day.autoStartSlot = false;
                    day.autoStartValue = "";
                  } else {
                    day.spots[0] = previousAccommodation;
                    day.autoStartValue = previousAccommodation;
                  }
                }
              } else {
                day.spots.unshift(previousAccommodation);
                day.autoStartSlot = true;
                day.autoStartValue = previousAccommodation;
              }
            } else {
              const managedValue = (day.autoStartValue || "").trim();
              if (day.autoStartSlot && day.spots.length > 0 && ((day.spots[0] || "").trim() === managedValue || !managedValue)) {
                day.spots.shift();
              }
              day.autoStartSlot = false;
              day.autoStartValue = "";
            }
          }
        }
      }

      function openRoute(origin, destination, mapType) {
        const from = encodeURIComponent(origin.trim());
        const to = encodeURIComponent(destination.trim());
        const url =
          mapType === "apple"
            ? `https://maps.apple.com/?saddr=${from}&daddr=${to}`
            : `https://www.google.com/maps/dir/?api=1&origin=${from}&destination=${to}`;
        const mapWindow = window.open(url, "_blank");
        if (mapWindow) {
          mapWindow.opener = null;
        }
        if (!mapWindow) {
          window.location.assign(url);
        }
      }

      function animateSpotReorder(dayIndices, mutateFn) {
        const indices = Array.isArray(dayIndices) ? [...new Set(dayIndices)] : [dayIndices];
        const firstRects = new Map();
        indices.forEach((idx) => {
          const section = document.getElementById(`day-section-${idx}`);
          if (section) {
            section.querySelectorAll('[data-spot-card="true"]').forEach((card) => {
              const val = card.dataset.spotValue;
              if (val) {
                firstRects.set(`${idx}-${val}`, card.getBoundingClientRect());
              }
            });
          }
        });
        mutateFn();
        render();
        indices.forEach((idx) => {
          const newSection = document.getElementById(`day-section-${idx}`);
          if (!newSection) return;
          newSection.querySelectorAll('[data-spot-card="true"]').forEach((card) => {
            const val = card.dataset.spotValue;
            const firstRect = firstRects.get(`${idx}-${val}`);
            if (!firstRect) return;
            const lastRect = card.getBoundingClientRect();
            const deltaY = firstRect.top - lastRect.top;
            if (!deltaY) return;
            card.style.transition = "none";
            card.style.transform = `translateY(${deltaY}px)`;
            requestAnimationFrame(() => {
              card.style.transition = "transform 300ms ease";
              card.style.transform = "";
            });
          });
        });
      }

      function moveSpot(dayIndex, index, direction) {
        const day = state.days[dayIndex];
        const targetIndex = index + direction;
        if (targetIndex < 0 || targetIndex >= day.spots.length) return;
        animateSpotReorder(dayIndex, () => {
          [day.spots[index], day.spots[targetIndex]] = [day.spots[targetIndex], day.spots[index]];
          if (dayIndex > 0 && (index === 0 || targetIndex === 0)) {
            day.autoStart = false;
            day.autoStartSlot = false;
            day.autoStartValue = "";
          }
          state.openRouteMenuIndex = null;
          saveState();
        });
      }

      function moveSpotTo(fromDayIndex, fromIndex, toDayIndex, toIndex) {
        // 互換性フォールバック: 引数が3つの場合は同一日内の移動とみなす
        if (toIndex === undefined && arguments.length === 3) {
          toIndex = toDayIndex;
          toDayIndex = fromDayIndex;
        }

        const fromDay = state.days[fromDayIndex];
        const toDay = state.days[toDayIndex];
        if (!fromDay || !toDay) return;
        if (fromIndex < 0 || fromIndex >= fromDay.spots.length) return;

        // 同一日内の場合
        if (fromDayIndex === toDayIndex) {
          if (fromIndex === toIndex || toIndex < 0 || toIndex >= fromDay.spots.length) return;
          animateSpotReorder(fromDayIndex, () => {
            const [moved] = fromDay.spots.splice(fromIndex, 1);
            fromDay.spots.splice(toIndex, 0, moved);
            if (fromDayIndex > 0 && (fromIndex === 0 || toIndex === 0)) {
              fromDay.autoStart = false;
              fromDay.autoStartSlot = false;
              fromDay.autoStartValue = "";
            }
            state.openRouteMenuIndex = null;
            saveState();
          });
          return;
        }

        // 異なる日への移動
        let targetIndex = toIndex;
        if (typeof targetIndex !== "number" || targetIndex < 0 || targetIndex > toDay.spots.length) {
          targetIndex = toDay.spots.length;
        }

        animateSpotReorder([fromDayIndex, toDayIndex], () => {
          const [moved] = fromDay.spots.splice(fromIndex, 1);
          toDay.spots.splice(targetIndex, 0, moved);
          if (fromDayIndex > 0 && fromIndex === 0) {
            fromDay.autoStart = false;
            fromDay.autoStartSlot = false;
            fromDay.autoStartValue = "";
          }
          if (toDayIndex > 0 && targetIndex === 0) {
            toDay.autoStart = false;
            toDay.autoStartSlot = false;
            toDay.autoStartValue = "";
          }
          state.openRouteMenuIndex = null;
          saveState();
        });
      }

      function getDayRouteUrl(locations, mapType = state.mapType) {
        const validLocations = (locations || []).map((loc) => (loc || "").trim()).filter(Boolean);
        if (validLocations.length < 2) return "";
        const origin = encodeURIComponent(validLocations[0]);
        const destination = encodeURIComponent(validLocations[validLocations.length - 1]);
        const waypoints = validLocations.slice(1, -1);

        if (mapType === "apple") {
          if (waypoints.length > 0) {
            const waypointsParams = waypoints.map((wp) => `waypoint=${encodeURIComponent(wp)}`).join("&");
            return `https://maps.apple.com/directions?source=${origin}&destination=${destination}&${waypointsParams}`;
          }
          return `https://maps.apple.com/?saddr=${origin}&daddr=${destination}`;
        }
        const waypointsParam = waypoints.map(encodeURIComponent).join("%7C");
        return `https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${destination}${waypointsParam ? `&waypoints=${waypointsParam}` : ""}`;
      }

      let currentToastEl = null;
      let toastTimeoutId = null;

      function showToast(message, onUndo) {
        if (currentToastEl) {
          currentToastEl.remove();
          if (toastTimeoutId) clearTimeout(toastTimeoutId);
        }

        const toast = document.createElement("div");
        toast.className =
          "fixed bottom-6 left-1/2 z-50 flex max-w-[90vw] -translate-x-1/2 items-center gap-3 rounded-xl bg-slate-900 px-4 py-2.5 text-sm text-white shadow-xl backdrop-blur-sm transition-all";

        const textSpan = document.createElement("span");
        textSpan.textContent = message;
        toast.appendChild(textSpan);

        if (typeof onUndo === "function") {
          const undoBtn = document.createElement("button");
          undoBtn.type = "button";
          undoBtn.className =
            "shrink-0 font-bold text-sky-400 underline decoration-sky-400/60 underline-offset-2 transition hover:text-sky-300";
          undoBtn.textContent = "元に戻す";
          undoBtn.addEventListener("click", () => {
            toast.remove();
            if (toastTimeoutId) clearTimeout(toastTimeoutId);
            onUndo();
          });
          toast.appendChild(undoBtn);
        }

        document.body.appendChild(toast);
        currentToastEl = toast;
        toastTimeoutId = setTimeout(() => {
          toast.remove();
          if (currentToastEl === toast) currentToastEl = null;
        }, onUndo ? 6000 : 2500);
      }

      // 将来の共有URL生成用関数
      // 共有リンク機能（例: URLパラメータ連携やサーバー保存など）を実装する際、
      // この関数でURLを返せば、LINE共有テキストの末尾に自動で追記されます。
      function getShareUrl() {
        // 実装例: return `${window.location.origin}${window.location.pathname}?trip=${activeTripId}`;
        return "";
      }

      function generateItineraryText() {
        const title = state.tripName.trim() ? state.tripName.trim() : "旅行";
        const lines = [`【${title}】`, ""];
        state.days.forEach((day, dayIndex) => {
          const items = getDayItems(day, dayIndex);
          lines.push(`■ ${day.name}`);
          items.forEach((item, index) => {
            if (item.type === "accommodation") {
              lines.push(`[宿泊地: ${item.value}]`);
            } else {
              const suffix = item.type === "endpoint" ? (item.label === "出発地点" ? " (出発)" : " (到着)") : "";
              lines.push(`・${item.value}${suffix}`);
            }
            const nextItem = items[index + 1];
            if (nextItem) {
              const from = (item.value || "").trim();
              const to = (nextItem.value || "").trim();
              let routeUrl = "";
              if (from && to) {
                const encodedFrom = encodeURIComponent(from);
                const encodedTo = encodeURIComponent(to);
                routeUrl =
                  state.mapType === "apple"
                    ? `https://maps.apple.com/?saddr=${encodedFrom}&daddr=${encodedTo}`
                    : `https://www.google.com/maps/dir/?api=1&origin=${encodedFrom}&destination=${encodedTo}`;
              }
              lines.push(routeUrl ? ` ↓ (ルート: ${routeUrl})` : " ↓");
            }
          });
          lines.push("");
        });

        // 将来の共有URLが指定されている場合は末尾に付加
        const shareUrl = getShareUrl();
        if (shareUrl) {
          lines.push("▼ 旅程の確認・編集はこちら", shareUrl);
        }

        return lines.join("\n").trim();
      }

      async function copyShareItinerary(triggerBtn) {
        const text = generateItineraryText();
        try {
          await navigator.clipboard.writeText(text);
          showToast("コピーしました！");

          // コピー完了のマイクロインタラクション（チェックアイコンに一時変更）
          if (triggerBtn) {
            const originalHtml = triggerBtn.innerHTML;
            triggerBtn.innerHTML = '<i data-lucide="check" class="h-3.5 w-3.5 sm:h-4 sm:w-4 text-emerald-600"></i>';
            if (window.lucide) lucide.createIcons();
            setTimeout(() => {
              triggerBtn.innerHTML = originalHtml;
              if (window.lucide) lucide.createIcons();
            }, 1500);
          }
        } catch {
          alert("コピーに失敗しました。");
        }
      }

      function addSpot() {
        const value = newSpotInputEl.value.trim();
        if (!value) return;
        const day = state.days[state.activeDayIndex];
        if (state.addLocationType === "departure") {
          state.departure = value;
          state.arrival = value;
          state.autoArrival = true;
        } else if (state.addLocationType === "accommodation") {
          const nextDay = state.days[state.activeDayIndex + 1];
          day.accommodation = value;
          day.autoAccommodation = false;
          if (state.addAccommodationScope === "all") {
            for (let i = state.activeDayIndex + 1; i < state.days.length; i++) {
              state.days[i].autoAccommodation = true;
            }
          } else if (nextDay) {
            nextDay.accommodation = value;
            nextDay.autoAccommodation = false;
          }
          syncAutoStarts();
        } else {
          day.spots.push(value);
        }
        newSpotInputEl.value = "";
        state.addLocationType = "spot";
        saveState();
        render();
      }

      function setTagStyle(button, selected) {
        button.setAttribute("aria-pressed", String(selected));
        button.style.backgroundColor = selected ? "#18181b" : "#ffffff";
        button.style.borderColor = selected ? "#18181b" : "#d4d4d8";
        button.style.color = selected ? "#ffffff" : "#3f3f46";
      }

      function renderAddSpotOptions() {
        if (addLocationTypeSelectEl) {
          addLocationTypeSelectEl.value = state.addLocationType;
        }
        addAccommodationScopeEl.classList.toggle("hidden", state.addLocationType !== "accommodation");
        const note =
          state.addLocationType === "departure"
            ? "到着地点は後から上書きできます。"
            : "";
        addTypeNoteEl.textContent = note;
        addTypeNoteEl.classList.toggle("hidden", !note);
        setTagStyle(addAccommodationScopeAllEl, state.addAccommodationScope === "all");
        setTagStyle(addAccommodationScopeTodayEl, state.addAccommodationScope === "today");
        newSpotInputEl.placeholder =
          state.addLocationType === "departure"
            ? "例: 東京駅"
            : state.addLocationType === "accommodation"
              ? "例: 京都駅周辺"
              : "例: 浅草寺";

      }

      function addDay() {
        const prevAccommodation = (state.days[state.days.length - 1].accommodation || "").trim();
        state.days.push(createDay(state.days.length + 1, prevAccommodation));
        state.activeDayIndex = state.days.length - 1;
        saveState();
        render();
        document.getElementById(`day-section-${state.activeDayIndex}`)?.scrollIntoView({ behavior: "smooth", block: "start" });
      }

      const dayUndoStack = [];

      function undoDeleteDay() {
        if (dayUndoStack.length === 0) return false;
        const item = dayUndoStack.pop();
        if (!item || !item.day) return false;

        state.days.splice(item.index, 0, item.day);
        state.days.forEach((day, index) => {
          day.name = `Day ${index + 1}`;
        });
        state.activeDayIndex = Math.min(item.index, state.days.length - 1);
        state.openRouteMenuIndex = null;
        syncAutoStarts();
        saveState();
        render();
        scrollToDay(state.activeDayIndex);
        showToast(`「${item.day.name}」を元に戻しました`);
        return true;
      }

      function deleteActiveDay() {
        if (state.days.length <= 1) {
          alert("日程は最低1日必要です。");
          return;
        }

        const targetIndex = state.activeDayIndex;
        const targetDay = state.days[targetIndex];
        const targetName = targetDay?.name || `Day ${targetIndex + 1}`;

        // セッション内Undo用にディープコピーして保持
        dayUndoStack.push({
          index: targetIndex,
          day: JSON.parse(JSON.stringify(targetDay))
        });

        state.days.splice(targetIndex, 1);
        state.days.forEach((day, index) => {
          day.name = `Day ${index + 1}`;
          if (index === 0 && day.autoStartSlot && (day.spots[0] || "").trim() === (day.autoStartValue || "").trim()) {
            day.spots.shift();
            day.autoStart = false;
            day.autoStartSlot = false;
            day.autoStartValue = "";
          }
          if (index === 0) {
            day.autoAccommodation = false;
          }
        });
        state.activeDayIndex = Math.min(targetIndex, state.days.length - 1);
        state.openRouteMenuIndex = null;
        syncAutoStarts();
        saveState();
        render();
        scrollToDay(state.activeDayIndex);
        showToast(`「${targetName}」を削除しました（Ctrl+Zで戻せます）`, () => {
          undoDeleteDay();
        });
      }

      function updateStickyOffsets() {
        if (addSpotFormEl) {
          const height = Math.round(addSpotFormEl.getBoundingClientRect().height);
          document.documentElement.style.setProperty("--sticky-form-height", `${height}px`);
        }
      }

      function scrollToDay(index) {
        const section = document.getElementById(`day-section-${index}`);
        if (!section) return;
        updateStickyOffsets();
        const formHeight = addSpotFormEl ? Math.round(addSpotFormEl.getBoundingClientRect().height) : 135;
        const sectionTop = section.getBoundingClientRect().top + window.scrollY;
        const targetScrollY = Math.max(0, sectionTop - formHeight + 2);
        window.scrollTo({ top: targetScrollY, behavior: "smooth" });
      }

      function renderTabs() {
        dayTabsEl.innerHTML = "";
        state.days.forEach((day, index) => {
          const button = document.createElement("button");
          const active = index === state.activeDayIndex;
          button.className = `w-14 sm:w-16 shrink-0 rounded-lg border px-1 py-1.5 sm:px-1.5 sm:py-2 text-center text-xs sm:text-sm font-medium whitespace-nowrap shadow-xs transition-all duration-75 ${
            active ? "text-white" : "border-slate-300 bg-white text-slate-700 hover:border-slate-400 hover:bg-slate-100 hover:text-slate-900 hover:scale-105 hover:shadow-xs"
          }`;
          if (active) {
            button.style.backgroundColor = "#18181b";
            button.style.borderColor = "#18181b";
            button.style.color = "#ffffff";
          }
          button.textContent = day.name;
          button.addEventListener("click", () => {
            state.activeDayIndex = index;
            state.openRouteMenuIndex = null;
            saveState();

            isScrollingToTab = true;
            if (scrollTimeoutId) clearTimeout(scrollTimeoutId);
            scrollTimeoutId = setTimeout(() => {
              isScrollingToTab = false;
            }, 800);

            scrollToDay(index);
            renderAddSpotOptions();
            renderTabs();
          });
          button.addEventListener("dragover", (e) => {
            if (!draggedSpot) return;
            e.preventDefault();
            e.dataTransfer.dropEffect = "move";
            button.classList.add("ring-2", "ring-slate-900", "scale-105");
          });
          button.addEventListener("dragleave", (e) => {
            if (button.contains(e.relatedTarget)) return;
            button.classList.remove("ring-2", "ring-slate-900", "scale-105");
          });
          button.addEventListener("drop", (e) => {
            if (!draggedSpot) return;
            e.preventDefault();
            button.classList.remove("ring-2", "ring-slate-900", "scale-105");
            const fromDayIndex = draggedSpot.dayIndex;
            const fromIndex = draggedSpot.index;
            moveSpotTo(fromDayIndex, fromIndex, index, state.days[index].spots.length);
            state.activeDayIndex = index;
            scrollToDay(index);
          });
          dayTabsEl.appendChild(button);
        });

        const addButton = document.createElement("button");
        addButton.type = "button";
        addButton.className =
          "flex h-8 w-8 sm:h-9 sm:w-9 shrink-0 items-center justify-center self-center rounded-full bg-slate-900 p-0 text-base sm:text-lg font-semibold leading-none text-white shadow-xs transition-all duration-75 hover:scale-105 hover:bg-slate-800 hover:shadow-md active:scale-90 cursor-pointer";
        const addIcon = document.createElement("span");
        addIcon.textContent = "+";
        addIcon.style.transform = "translateY(-1px)";
        addButton.appendChild(addIcon);
        addButton.setAttribute("aria-label", "日程追加");
        addButton.addEventListener("click", addDay);
        dayTabsEl.appendChild(addButton);

        const deleteButton = document.createElement("button");
        deleteButton.type = "button";
        deleteButton.className =
          "flex h-8 w-8 sm:h-9 sm:w-9 shrink-0 items-center justify-center self-center rounded-full bg-slate-200 p-0 text-base sm:text-lg font-semibold leading-none text-slate-700 transition-all duration-75 hover:scale-105 hover:bg-slate-300 hover:text-slate-900 hover:shadow-md active:scale-90 disabled:cursor-not-allowed disabled:opacity-40 disabled:hover:scale-100 disabled:hover:bg-slate-200 disabled:hover:text-slate-700 disabled:hover:shadow-none cursor-pointer";
        const deleteIcon = document.createElement("span");
        deleteIcon.textContent = "−";
        deleteIcon.style.transform = "translateY(-1px)";
        deleteButton.appendChild(deleteIcon);
        const activeDayName = state.days[state.activeDayIndex]?.name || `Day ${state.activeDayIndex + 1}`;
        deleteButton.setAttribute("aria-label", `選択中の日程（${activeDayName}）を削除`);
        deleteButton.disabled = state.days.length <= 1;
        deleteButton.addEventListener("click", deleteActiveDay);
        dayTabsEl.appendChild(deleteButton);

        // 仕切り線（日程操作と共有アクションの区切り）
        const divider = document.createElement("div");
        divider.className = "w-6 sm:w-8 border-t border-slate-300 my-0.5 shrink-0 self-center";
        divider.setAttribute("role", "separator");
        dayTabsEl.appendChild(divider);

        // LINE共有コピーボタン（丸アイコン・モノトーン）
        const shareButton = document.createElement("button");
        shareButton.type = "button";

      function getDayItems(day, dayIndex) {
        const isFirstDay = dayIndex === 0;
        const isLastDay = dayIndex === state.days.length - 1;
        const departure = isFirstDay ? state.departure.trim() : "";
        const arrival = isLastDay ? state.arrival.trim() : "";
        const accommodation = day.accommodation.trim();
        const items = [];

        if (departure) {
          items.push({ type: "endpoint", value: departure, label: "出発地点" });
        }
        day.spots.forEach((spot, index) => {
          items.push({ type: "spot", value: spot, spotIndex: index });
        });
        if (accommodation && !isLastDay) {
          items.push({ type: "accommodation", value: accommodation });
        }
        if (arrival) {
          items.push({ type: "endpoint", value: arrival, label: "到着地点" });
        }
        return items;
      }

      function createDayTimeline(day, dayIndex) {
        const details = document.createElement("details");
        details.id = `day-section-${dayIndex}`;
        details.dataset.dayIndex = String(dayIndex);
        details.className = "border-t border-slate-200 py-2 first:border-t-0 first:pt-0";
        details.style.scrollMarginTop = "var(--sticky-form-height, 135px)";
        details.open = !collapsedDays.has(dayIndex);

        const summary = document.createElement("summary");
        summary.className =
          "sticky z-20 flex cursor-pointer items-center justify-between gap-3 rounded-xl bg-white/95 px-3 py-2.5 backdrop-blur-sm shadow-xs transition-colors duration-75 hover:bg-slate-50";
        summary.style.top = "var(--sticky-form-height, 135px)";
        summary.style.listStyle = "none";

        const chevronWrap = document.createElement("div");
        chevronWrap.className = "flex shrink-0 items-center gap-1.5 text-slate-400 py-1";

        const chevron = document.createElement("i");
        chevron.setAttribute("data-lucide", "chevron-down");
        chevron.className = "h-4 w-4 shrink-0 text-slate-400 day-chevron";

        chevronWrap.appendChild(chevron);

        const items = getDayItems(day, dayIndex);

        // 閉じるアイコンの隣（Day見出しの左隣）に閉じた時だけ表示するルート概要
        const routeSummary = document.createElement("div");
        routeSummary.className = `min-w-0 flex-1 overflow-hidden ${details.open ? "hidden" : ""}`;

        const routeLocations = items.map((item) => (item.value || "").trim()).filter(Boolean);
        if (routeLocations.length > 0) {
          const routeText = document.createElement("span");
          routeText.className = "block truncate text-xs font-normal text-slate-500";
          routeText.textContent = routeLocations.join(" → ");
          routeText.title = routeLocations.join(" → ");
          routeSummary.appendChild(routeText);
        }

        const heading = document.createElement(items.length < 2 ? "h2" : "a");
        heading.className = items.length < 2
          ? "shrink-0 text-lg font-bold text-slate-800"
          : "shrink-0 text-lg font-bold text-slate-900 transition-colors duration-75 hover:text-slate-600 hover:underline inline-flex items-center gap-1.5 cursor-pointer";
        heading.textContent = day.name;

        if (items.length >= 2) {
          const mapLabel = state.mapType === "apple" ? "Apple" : "Google";
          heading.href = getDayRouteUrl(items.map((item) => item.value));
          heading.target = "_blank";
          heading.rel = "noopener noreferrer";
          heading.setAttribute("data-tooltip", `${mapLabel}でこの日のルートを開く`);
          heading.setAttribute("data-tooltip-pos", "bottom");
          heading.addEventListener("click", (e) => e.stopPropagation());

          const extIcon = document.createElement("i");
          extIcon.setAttribute("data-lucide", "external-link");
          extIcon.className = "h-4 w-4 text-slate-400 shrink-0";
          heading.appendChild(extIcon);
        }

        details.addEventListener("toggle", () => {
          if (details.open) {
            collapsedDays.delete(dayIndex);
          } else {
            collapsedDays.add(dayIndex);
          }
          routeSummary.classList.toggle("hidden", details.open);
        });

        details.addEventListener("click", () => {
          if (state.activeDayIndex !== dayIndex) {
            state.activeDayIndex = dayIndex;
            saveState();
            renderAddSpotOptions();
            renderTabs();
          }
        });

        summary.append(chevronWrap, routeSummary, heading);
        summary.addEventListener("dragover", (e) => {
          if (!draggedSpot) return;
          e.preventDefault();
          e.dataTransfer.dropEffect = "move";
          summary.classList.add("ring-2", "ring-slate-900");
        });
        summary.addEventListener("dragleave", (e) => {
          if (summary.contains(e.relatedTarget)) return;
          summary.classList.remove("ring-2", "ring-slate-900");
        });
        summary.addEventListener("drop", (e) => {
          if (!draggedSpot) return;
          e.preventDefault();
          summary.classList.remove("ring-2", "ring-slate-900");
          details.open = true;
          collapsedDays.delete(dayIndex);
          const fromDayIndex = draggedSpot.dayIndex;
          const fromIndex = draggedSpot.index;
          moveSpotTo(fromDayIndex, fromIndex, dayIndex, state.days[dayIndex].spots.length);
        });
        details.appendChild(summary);

        const body = document.createElement("div");
        body.className = "pt-2";

        if (items.length === 0) {
          const empty = document.createElement("div");
          empty.className = "rounded-xl border-2 border-dashed border-slate-300 bg-slate-50 p-6 text-center text-sm text-slate-500 transition-colors duration-75";
          empty.textContent = "まだスポットがありません。上の入力から追加するか、スポットをここにドラッグ＆ドロップしてください。";
          empty.addEventListener("dragover", (e) => {
            if (!draggedSpot) return;
            e.preventDefault();
            e.dataTransfer.dropEffect = "move";
            empty.classList.add("border-slate-800", "bg-slate-100");
          });
          empty.addEventListener("dragleave", (e) => {
            if (empty.contains(e.relatedTarget)) return;
            empty.classList.remove("border-slate-800", "bg-slate-100");
          });
          empty.addEventListener("drop", (e) => {
            if (!draggedSpot) return;
            e.preventDefault();
            empty.classList.remove("border-slate-800", "bg-slate-100");
            const fromDayIndex = draggedSpot.dayIndex;
            const fromIndex = draggedSpot.index;
            moveSpotTo(fromDayIndex, fromIndex, dayIndex, 0);
          });
          body.appendChild(empty);
          details.appendChild(body);
          return details;
        }

        items.forEach((item, index) => {
          if (item.type === "spot") {
            body.appendChild(createSpotCard(item.value, item.spotIndex, index, dayIndex));
          } else if (item.type === "accommodation") {
            body.appendChild(createAccommodationCard(item.value, index, dayIndex));
          } else {
            body.appendChild(createEndpointCard(item.value, index, item.label, dayIndex));
          }
          if (index < items.length - 1) {
            body.appendChild(createRouteConnector(item.value, items[index + 1].value, index, dayIndex));
          }
        });

        // 日程の末尾へ追加するためのドロップゾーン
        const dropZone = document.createElement("div");
        dropZone.className = "h-8 rounded-xl border border-dashed border-transparent transition-colors duration-75 mt-2 flex items-center justify-center text-xs text-slate-400";
        dropZone.dataset.dropZone = "true";
        dropZone.addEventListener("dragover", (e) => {
          if (!draggedSpot) return;
          e.preventDefault();
          e.dataTransfer.dropEffect = "move";
          dropZone.classList.remove("border-transparent");
          dropZone.classList.add("border-slate-400", "bg-slate-100", "text-slate-600");
          dropZone.textContent = "この日の末尾に追加";
        });
        dropZone.addEventListener("dragleave", (e) => {
          if (dropZone.contains(e.relatedTarget)) return;
          dropZone.classList.remove("border-slate-400", "bg-slate-100", "text-slate-600");
          dropZone.classList.add("border-transparent");
          dropZone.textContent = "";
        });
        dropZone.addEventListener("drop", (e) => {
          if (!draggedSpot) return;
          e.preventDefault();
          dropZone.classList.remove("border-slate-400", "bg-slate-100", "text-slate-600");
          dropZone.classList.add("border-transparent");
          dropZone.textContent = "";
          const fromDayIndex = draggedSpot.dayIndex;
          const fromIndex = draggedSpot.index;
          moveSpotTo(fromDayIndex, fromIndex, dayIndex, state.days[dayIndex].spots.length);
        });
        body.appendChild(dropZone);

        details.appendChild(body);
        return details;
      }

      function renderTimeline() {
        timelineEl.innerHTML = "";
        state.days.forEach((day, index) => {
          timelineEl.appendChild(createDayTimeline(day, index));
        });
      }

      function renderEndpoints() {
        const isLastDay = state.activeDayIndex === state.days.length - 1;
        endpointSectionEl.classList.add("hidden");
        departureFieldEl.classList.add("hidden");
        departureInputEl.value = state.departure;
        accommodationSectionEl.classList.add("hidden");
      }

      function renderAccommodation() {
        const day = state.days[state.activeDayIndex];
        accommodationInputEl.value = day.accommodation;
        const allDays = state.accommodationUpdateScope === "all";
        accommodationScopeAllEl.setAttribute("aria-pressed", String(allDays));
        accommodationScopeNextDayEl.setAttribute("aria-pressed", String(!allDays));
        accommodationScopeAllEl.style.backgroundColor = allDays ? "#18181b" : "#ffffff";
        accommodationScopeAllEl.style.borderColor = allDays ? "#18181b" : "#d4d4d8";
        accommodationScopeAllEl.style.color = allDays ? "#ffffff" : "#3f3f46";
        accommodationScopeNextDayEl.style.backgroundColor = allDays ? "#ffffff" : "#18181b";
        accommodationScopeNextDayEl.style.borderColor = allDays ? "#d4d4d8" : "#18181b";
        accommodationScopeNextDayEl.style.color = allDays ? "#3f3f46" : "#ffffff";
      }

      function updateActiveDayFromScroll() {
        if (isScrollingToTab) return;
        const sections = [...document.querySelectorAll("[data-day-index]")];
        if (sections.length === 0) return;

        const formRect = addSpotFormEl ? addSpotFormEl.getBoundingClientRect() : null;
        const targetY = formRect ? Math.round(formRect.bottom + 16) : 140;
        let currentSection = null;

        for (const section of sections) {
          const rect = section.getBoundingClientRect();
          if (rect.top <= targetY && rect.bottom > targetY) {
            currentSection = section;
            break;
          }
        }

        if (!currentSection) {
          currentSection = sections.reduce((closest, section) => {
            const rect = section.getBoundingClientRect();
            const closestRect = closest.getBoundingClientRect();
            return Math.abs(rect.top - targetY) < Math.abs(closestRect.top - targetY) ? section : closest;
          });
        }

        const dayIndex = Number(currentSection.dataset.dayIndex);
        if (dayIndex !== state.activeDayIndex) {
          state.activeDayIndex = dayIndex;
          renderAddSpotOptions();
          renderTabs();
        }
      }

      function render() {
        ensureValidState();
        syncAutoStarts();
        if (state.autoArrival) {
          state.arrival = state.departure;
        }
        if (tripNameInputEl) {
          tripNameInputEl.value = state.tripName;
        }
        updateStickyOffsets();
        renderTripSwitcher();
        renderTabs();
        renderAddSpotOptions();
        renderTimeline();
        renderEndpoints();
        renderAccommodation();
        updateMapTypeUI();
        if (window.lucide) {
          lucide.createIcons();
        }
      }

      addSpotFormEl.addEventListener("submit", (e) => {
        e.preventDefault();
        addSpot();
      });

      if (tripNameInputEl) {
        tripNameInputEl.addEventListener("input", (e) => {
          state.tripName = e.target.value;
          saveState();
          if (tripSwitcherEl) {
            const activeOption = tripSwitcherEl.querySelector(`option[value="${activeTripId}"]`);
            if (activeOption) {
              const index = trips.findIndex((t) => t.id === activeTripId);
              activeOption.textContent = state.tripName.trim() ? state.tripName : `旅行${index + 1}`;
            }
          }
          if (isTripMenuOpen) {
            renderTripComboboxMenu();
          }
        });
        tripNameInputEl.addEventListener("keydown", (e) => {
          if (e.key === "Escape") {
            toggleTripMenu(false);
          }
        });
      }

      if (tripComboboxToggleEl) {
        tripComboboxToggleEl.addEventListener("click", (e) => {
          e.stopPropagation();
          toggleTripMenu();
        });
      }

      document.addEventListener("click", (e) => {
        if (!tripComboboxContainerEl) return;
        if (!tripComboboxContainerEl.contains(e.target)) {
          toggleTripMenu(false);
        }
      });

      if (tripSwitcherEl) {
        tripSwitcherEl.addEventListener("change", (e) => {
          saveTrips();
          activeTripId = e.target.value;
          applyActiveTripToState();
          saveTrips();
          render();
        });
      }

      if (tripNewBtnEl) {
        tripNewBtnEl.addEventListener("click", createNewTrip);
      }

      if (tripDeleteBtnEl) {
        tripDeleteBtnEl.addEventListener("click", () => {
          deleteTrip(activeTripId);
        });
      }

      if (addLocationTypeSelectEl) {
        addLocationTypeSelectEl.addEventListener("change", (e) => {
          state.addLocationType = e.target.value;
          renderAddSpotOptions();
        });
      }

      addAccommodationScopeAllEl.addEventListener("click", () => {
        state.addAccommodationScope = "all";
        renderAddSpotOptions();
      });

      addAccommodationScopeTodayEl.addEventListener("click", () => {
        state.addAccommodationScope = "today";
        renderAddSpotOptions();
      });

      function flushAccommodationSync(shouldRender = true, sourceDayIndex, sourceValue) {
        const hasExplicitSource = sourceDayIndex !== undefined && sourceValue !== undefined;
        if (!hasExplicitSource && pendingAccommodationSync) {
          sourceDayIndex = pendingAccommodationSync.dayIndex;
          sourceValue = pendingAccommodationSync.value;
        }
        if (sourceDayIndex === undefined) sourceDayIndex = state.activeDayIndex;
        if (sourceValue === undefined) sourceValue = accommodationInputEl.value;
        if (accommodationDebounceId) {
          clearTimeout(accommodationDebounceId);
          accommodationDebounceId = null;
        }
        pendingAccommodationSync = null;
        if (state.days[sourceDayIndex]) {
          state.days[sourceDayIndex].accommodation = sourceValue;
        }
        syncAutoStarts();
        saveState();
        if (shouldRender) {
          render();
        }
      }

      function scheduleAccommodationSync(dayIndex, accommodationValue) {
        if (accommodationDebounceId) {
          clearTimeout(accommodationDebounceId);
        }
        pendingAccommodationSync = { dayIndex, value: accommodationValue };
        accommodationDebounceId = setTimeout(() => {
          if (pendingAccommodationSync && state.days[pendingAccommodationSync.dayIndex]) {
            state.days[pendingAccommodationSync.dayIndex].accommodation = pendingAccommodationSync.value;
          }
          accommodationDebounceId = null;
          pendingAccommodationSync = null;
          syncAutoStarts();
          saveState();
          if (state.activeDayIndex === dayIndex) {
            render();
          }
        }, 180);
      }

      accommodationInputEl.addEventListener("input", (e) => {
        const dayIndex = state.activeDayIndex;
        const day = state.days[dayIndex];
        const nextNextDay = state.days[dayIndex + 2];
        const nextNextAccommodation = nextNextDay ? nextNextDay.accommodation : "";
        day.accommodation = e.target.value;
        day.autoAccommodation = false;

        if (state.accommodationUpdateScope === "all") {
          for (let i = dayIndex + 1; i < state.days.length; i++) {
            state.days[i].autoAccommodation = true;
          }
        } else {
          const nextDay = state.days[dayIndex + 1];
          if (nextDay) {
            nextDay.autoAccommodation = true;
          }
          if (nextNextDay) {
            nextNextDay.accommodation = nextNextAccommodation;
            nextNextDay.autoAccommodation = false;
          }
        }
        syncAutoStarts();
        saveState();
        scheduleAccommodationSync(state.activeDayIndex, e.target.value);
      });

      departureInputEl.addEventListener("input", (e) => {
        state.departure = e.target.value;
        state.arrival = e.target.value;
        state.autoArrival = true;
        saveState();
        renderTimeline();
      });

      accommodationScopeAllEl.addEventListener("click", () => {
        state.accommodationUpdateScope = "all";
        renderAccommodation();
      });

      accommodationScopeNextDayEl.addEventListener("click", () => {
        state.accommodationUpdateScope = "next-day";
        renderAccommodation();
      });

      accommodationInputEl.addEventListener("blur", () => {
        flushAccommodationSync(true, state.activeDayIndex, accommodationInputEl.value);
      });

      window.addEventListener("scroll", updateActiveDayFromScroll, { passive: true });
      window.addEventListener("resize", updateStickyOffsets, { passive: true });
      window.addEventListener("keydown", (e) => {
        const isZ = e.key === "z" || e.key === "Z";
        const isUndoKey = (e.ctrlKey || e.metaKey) && isZ && !e.shiftKey;
        if (isUndoKey) {
          const activeTag = document.activeElement ? document.activeElement.tagName.toLowerCase() : "";
          const isEditable = activeTag === "input" || activeTag === "textarea" || document.activeElement?.isContentEditable;
          if (!isEditable && dayUndoStack.length > 0) {
            e.preventDefault();
            undoDeleteDay();
          }
        }
      });

      // グローバル・ホバーメッセージ（ツールチップ）制御
      let activeTooltipTarget = null;

      function getOrCreateTooltip() {
        let el = document.getElementById("app-tooltip");
        if (!el) {
          el = document.createElement("div");
          el.id = "app-tooltip";
          el.setAttribute("role", "tooltip");
          el.setAttribute("aria-hidden", "true");
          el.innerHTML = '<span id="app-tooltip-text"></span><div id="app-tooltip-arrow"></div>';
          document.body.appendChild(el);
        }
        return el;
      }

      function showGlobalTooltip(target) {
        if (!target) return;
        const text = target.getAttribute("data-tooltip");
        if (!text) {
          hideGlobalTooltip();
          return;
        }

        const el = getOrCreateTooltip();
        const textEl = el.querySelector("#app-tooltip-text");
        const arrowEl = el.querySelector("#app-tooltip-arrow");

        textEl.textContent = text;
        const pos = target.getAttribute("data-tooltip-pos") || "bottom";
        const rect = target.getBoundingClientRect();

        // ツールチップ自体の寸法を測定
        el.style.left = "-9999px";
        el.style.top = "-9999px";

        const tipWidth = el.offsetWidth;
        const tipHeight = el.offsetHeight;

        let left = 0;
        let top = 0;

        // 矢印位置のリセット
        arrowEl.style.top = "";
        arrowEl.style.bottom = "";
        arrowEl.style.left = "";
        arrowEl.style.right = "";
        arrowEl.style.transform = "";
        arrowEl.style.borderTopColor = "transparent";
        arrowEl.style.borderBottomColor = "transparent";
        arrowEl.style.borderLeftColor = "transparent";
        arrowEl.style.borderRightColor = "transparent";

        if (pos === "left") {
          left = rect.left - tipWidth - 8;
          top = rect.top + (rect.height - tipHeight) / 2;
          arrowEl.style.right = "-8px";
          arrowEl.style.top = "50%";
          arrowEl.style.transform = "translateY(-50%)";
          arrowEl.style.borderLeftColor = "#e2e8f0";
        } else if (pos === "top") {
          left = rect.left + (rect.width - tipWidth) / 2;
          top = rect.top - tipHeight - 8;
          arrowEl.style.bottom = "-8px";
          arrowEl.style.left = "50%";
          arrowEl.style.transform = "translateX(-50%)";
          arrowEl.style.borderTopColor = "#e2e8f0";
        } else {
          // bottom (デフォルト)
          left = rect.left + (rect.width - tipWidth) / 2;
          top = rect.bottom + 8;
          arrowEl.style.top = "-8px";
          arrowEl.style.left = "50%";
          arrowEl.style.transform = "translateX(-50%)";
          arrowEl.style.borderBottomColor = "#e2e8f0";
        }

        // 画面外へのはみ出し防止（クランプ）
        const pad = 8;
        left = Math.max(pad, Math.min(window.innerWidth - tipWidth - pad, left));
        top = Math.max(pad, Math.min(window.innerHeight - tipHeight - pad, top));

        el.style.left = `${Math.round(left)}px`;
        el.style.top = `${Math.round(top)}px`;
        el.classList.add("is-visible");
      }

      function hideGlobalTooltip() {
        const el = document.getElementById("app-tooltip");
        if (el) {
          el.classList.remove("is-visible");
        }
        activeTooltipTarget = null;
      }

      document.addEventListener("mouseover", (e) => {
        const target = e.target.closest("[data-tooltip]");
        if (!target || !target.getAttribute("data-tooltip")) {
          if (activeTooltipTarget) hideGlobalTooltip();
          return;
        }
        if (target === activeTooltipTarget) return;
        activeTooltipTarget = target;
        showGlobalTooltip(target);
      });

      document.addEventListener("mouseout", (e) => {
        const target = e.target.closest("[data-tooltip]");
        if (target && target === activeTooltipTarget) {
          const related = e.relatedTarget ? e.relatedTarget.closest("[data-tooltip]") : null;
          if (related === activeTooltipTarget) return;
          hideGlobalTooltip();
        }
      });

      window.addEventListener("scroll", () => {
        if (activeTooltipTarget) {
          showGlobalTooltip(activeTooltipTarget);
        }
      }, { passive: true });

      document.addEventListener("click", () => {
        hideGlobalTooltip();
      });

      document.querySelectorAll('input[name="map-type-radio"]').forEach((radio) => {
        radio.addEventListener("change", (e) => {
          if (e.target.checked) {
            setMapType(e.target.value);
          }
        });
      });

      loadState();
      ensureValidState();
      syncAutoStarts();
      saveState();
      render();
    </script>
    <!-- グローバル・ホバーメッセージ（ツールチップ要素） -->
    <div id="app-tooltip" role="tooltip" aria-hidden="true">
      <span id="app-tooltip-text"></span>
      <div id="app-tooltip-arrow"></div>
    </div>
  </body>
</html>
