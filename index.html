<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Roople</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" />
  </head>
  <body class="min-h-screen bg-slate-100 text-slate-900">
    <div class="mx-auto w-full max-w-5xl p-4 sm:p-6">
      <header class="mb-0 rounded-2xl bg-white p-5 pb-0 shadow-sm">
        <div class="flex flex-wrap items-center justify-between gap-2">
          <h1 class="text-2xl font-bold sm:text-3xl">Roople</h1>
          <div class="flex flex-wrap items-center gap-2">
            <select id="trip-switcher" class="rounded-lg border border-slate-300 bg-white px-2 py-1.5 text-sm outline-none"></select>
            <button id="trip-new-btn" type="button" class="rounded-lg border border-sky-300 bg-sky-50 px-2 py-1.5 text-xs font-medium text-sky-700">新しい旅程を作成</button>
            <button id="trip-delete-btn" type="button" class="rounded-lg border border-rose-300 bg-rose-50 px-2 py-1.5 text-xs font-medium text-rose-700">現在の旅程を削除</button>
          </div>
        </div>
        <p class="mt-2 text-sm text-slate-600">日程ごとにスポットをつなぎ、地図アプリでルート検索できます。</p>
      </header>

      <section class="rounded-2xl bg-white p-4 pt-2 shadow-sm sm:p-6 sm:pt-2">
        <div class="fixed right-4 top-1/2 z-30 flex flex-col items-center gap-2" id="day-tabs" style="transform: translateY(-50%)"></div>

        <form id="add-spot-form" class="sticky top-0 z-20 mr-24 mb-4 rounded-xl p-3 shadow-sm sm:p-4" style="background-color: rgba(248, 250, 252, 0.7)">
          <div class="mb-3">
            <div class="flex items-center justify-between gap-2">
              <label class="text-xs font-medium text-slate-500" for="trip-name-input">旅行名</label>
              <p id="add-target-day" class="whitespace-nowrap rounded-full border border-sky-300 bg-sky-50 px-2 py-1 text-xs font-semibold leading-none text-sky-700"></p>
            </div>
            <div class="min-w-0">
              <input
                id="trip-name-input"
                type="text"
                placeholder="旅行名を入力"
                class="mt-1 w-full border-b-2 border-slate-300 bg-transparent px-0 py-1 text-xl font-bold text-slate-900 outline-none transition focus:border-sky-500"
              />
            </div>
          </div>
          <label class="mb-2 block text-sm font-medium text-slate-700" for="new-spot-input">スポットを追加</label>
          <div class="mb-3 flex flex-wrap gap-2" role="group" aria-label="追加する地点の種類">
            <button id="add-type-spot" type="button" class="rounded-lg border border-slate-300 bg-white px-3 py-2 text-xs font-medium text-slate-700">スポット</button>
            <button id="add-type-departure" type="button" class="rounded-lg border border-slate-300 bg-white px-3 py-2 text-xs font-medium text-slate-700">出発地点/到着地点</button>
            <button id="add-type-accommodation" type="button" class="rounded-lg border border-slate-300 bg-white px-3 py-2 text-xs font-medium text-slate-700">宿泊地</button>
          </div>
          <p id="add-type-note" class="mb-3 hidden text-xs text-slate-500"></p>
          <div id="add-accommodation-scope" class="mb-3 hidden flex flex-wrap gap-2" role="group" aria-label="宿泊地の反映範囲">
            <button id="add-accommodation-scope-all" type="button" class="rounded-lg border border-slate-300 bg-white px-3 py-2 text-xs font-medium text-slate-700">以降すべて</button>
            <button id="add-accommodation-scope-today" type="button" class="rounded-lg border border-slate-300 bg-white px-3 py-2 text-xs font-medium text-slate-700">当日のみ</button>
          </div>
          <div class="flex gap-2">
            <input
              id="new-spot-input"
              type="text"
              placeholder="例: 浅草寺"
              class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm outline-none transition focus:border-sky-400 focus:ring-2 focus:ring-sky-100"
            />
            <button
              id="add-spot-btn"
              type="submit"
              class="shrink-0 rounded-lg bg-sky-600 px-4 py-2 text-sm font-medium text-white transition hover:bg-sky-700"
            >
              追加
            </button>
          </div>
        </form>

        <div id="timeline" class="mr-24 space-y-0"></div>

        <div id="endpoint-section" class="hidden mt-6 rounded-xl border border-slate-200 bg-slate-50 p-3 sm:p-4">
          <div id="departure-field">
            <label class="mb-2 block text-sm font-medium text-slate-700" for="departure-input">出発地点</label>
            <input
              id="departure-input"
              type="text"
              placeholder="例: 東京駅"
              class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm outline-none transition focus:border-sky-400 focus:ring-2 focus:ring-sky-100"
            />
          </div>
        </div>

        <div id="accommodation-section" class="hidden mt-6 rounded-xl border border-slate-200 bg-slate-50 p-3 sm:p-4">
          <label class="mb-2 block text-sm font-medium text-slate-700" for="accommodation-input">宿泊地</label>
          <div class="mb-3 flex gap-2" role="group" aria-label="宿泊地の変更範囲">
            <button id="accommodation-scope-all" type="button" class="rounded-lg border border-slate-300 bg-white px-3 py-2 text-xs font-medium text-slate-700">
              以降すべて
            </button>
            <button id="accommodation-scope-next-day" type="button" class="rounded-lg border border-slate-300 bg-white px-3 py-2 text-xs font-medium text-slate-700">
              当日・翌日だけ
            </button>
          </div>
          <input
            id="accommodation-input"
            type="text"
            placeholder="例: 京都駅周辺"
            class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm outline-none transition focus:border-sky-400 focus:ring-2 focus:ring-sky-100"
          />
          <p class="mt-2 text-xs text-slate-500">入力すると翌日の出発地点（先頭）にデフォルトで反映されます。</p>
        </div>
      </section>
    </div>

    <script>
      const STORAGE_KEY = "travel-itinerary-mvp-v1";

      const state = {
        days: [],
        activeDayIndex: 0,
        openRouteMenuIndex: null,
        accommodationUpdateScope: "all",
        departure: "",
        arrival: "",
        autoArrival: true,
        tripName: "",
        addLocationType: "spot",
        addAccommodationScope: "all"
      };

      const MAX_TRIPS = 3;
      const TRIPS_STORAGE_KEY = "travel-itinerary-trips-v1";
      let trips = [];
      let activeTripId = null;

      const dayTabsEl = document.getElementById("day-tabs");
      const timelineEl = document.getElementById("timeline");
      const tripNameInputEl = document.getElementById("trip-name-input");
      const tripSwitcherEl = document.getElementById("trip-switcher");
      const tripNewBtnEl = document.getElementById("trip-new-btn");
      const tripDeleteBtnEl = document.getElementById("trip-delete-btn");
      const addTargetDayEl = document.getElementById("add-target-day");
      const newSpotInputEl = document.getElementById("new-spot-input");
      const addSpotFormEl = document.getElementById("add-spot-form");
      const addTypeSpotEl = document.getElementById("add-type-spot");
      const addTypeDepartureEl = document.getElementById("add-type-departure");
      const addTypeAccommodationEl = document.getElementById("add-type-accommodation");
      const addTypeNoteEl = document.getElementById("add-type-note");
      const addAccommodationScopeEl = document.getElementById("add-accommodation-scope");
      const addAccommodationScopeAllEl = document.getElementById("add-accommodation-scope-all");
      const addAccommodationScopeTodayEl = document.getElementById("add-accommodation-scope-today");
      const endpointSectionEl = document.getElementById("endpoint-section");
      const departureFieldEl = document.getElementById("departure-field");
      const departureInputEl = document.getElementById("departure-input");
      const accommodationSectionEl = document.getElementById("accommodation-section");
      const accommodationInputEl = document.getElementById("accommodation-input");
      const accommodationScopeAllEl = document.getElementById("accommodation-scope-all");
      const accommodationScopeNextDayEl = document.getElementById("accommodation-scope-next-day");
      let accommodationDebounceId = null;
      let pendingAccommodationSync = null;

      function createDay(dayNumber, prevAccommodation = "") {
        return {
          name: `Day ${dayNumber}`,
          spots: dayNumber === 1 ? [] : prevAccommodation ? [prevAccommodation] : [],
          accommodation: dayNumber === 1 ? "" : prevAccommodation,
          autoAccommodation: dayNumber !== 1,
          autoStart: dayNumber !== 1,
          autoStartSlot: dayNumber !== 1 && !!prevAccommodation,
          autoStartValue: dayNumber !== 1 && !!prevAccommodation ? prevAccommodation : ""
        };
      }

      function ensureValidState() {
        if (!Array.isArray(state.days) || state.days.length === 0) {
          state.days = [createDay(1)];
        }
        if (typeof state.activeDayIndex !== "number" || state.activeDayIndex < 0 || state.activeDayIndex >= state.days.length) {
          state.activeDayIndex = 0;
        }
      }

      function generateTripId() {
        return `trip-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
      }

      function createTripEntry(tripName) {
        return {
          id: generateTripId(),
          tripName: tripName || "",
          days: [createDay(1)],
          activeDayIndex: 0,
          departure: "",
          arrival: "",
          autoArrival: true
        };
      }

      function sanitizeTrip(trip) {
        const sanitized = trip && typeof trip === "object" ? trip : {};
        sanitized.id = typeof sanitized.id === "string" && sanitized.id ? sanitized.id : generateTripId();
        sanitized.tripName = typeof sanitized.tripName === "string" ? sanitized.tripName : "";
        sanitized.days = Array.isArray(sanitized.days) && sanitized.days.length ? sanitized.days : [createDay(1)];
        for (let i = 0; i < sanitized.days.length; i++) {
          const day = sanitized.days[i] || {};
          day.name = day.name || `Day ${i + 1}`;
          day.spots = Array.isArray(day.spots) ? day.spots : [];
          day.accommodation = typeof day.accommodation === "string" ? day.accommodation : "";
          day.autoAccommodation = typeof day.autoAccommodation === "boolean" ? day.autoAccommodation : i !== 0;
          day.autoStart = typeof day.autoStart === "boolean" ? day.autoStart : i !== 0;
          day.autoStartSlot = typeof day.autoStartSlot === "boolean" ? day.autoStartSlot : day.autoStart && day.spots.length > 0;
          day.autoStartValue = typeof day.autoStartValue === "string" ? day.autoStartValue : day.autoStartSlot ? day.spots[0] || "" : "";
          sanitized.days[i] = day;
        }
        sanitized.activeDayIndex =
          Number.isInteger(sanitized.activeDayIndex) && sanitized.activeDayIndex >= 0 && sanitized.activeDayIndex < sanitized.days.length ? sanitized.activeDayIndex : 0;
        sanitized.departure = typeof sanitized.departure === "string" ? sanitized.departure : "";
        sanitized.arrival = typeof sanitized.arrival === "string" ? sanitized.arrival : "";
        sanitized.autoArrival = typeof sanitized.autoArrival === "boolean" ? sanitized.autoArrival : !sanitized.arrival || sanitized.arrival === sanitized.departure;
        return sanitized;
      }

      function migrateLegacyTrip() {
        // 旧バージョン（単一旅程保存）からの移行
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return null;
          return sanitizeTrip(JSON.parse(raw));
        } catch {
          return null;
        }
      }

      function loadTrips() {
        try {
          const raw = localStorage.getItem(TRIPS_STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            trips = Array.isArray(parsed.trips) && parsed.trips.length ? parsed.trips.slice(0, MAX_TRIPS).map(sanitizeTrip) : [];
            if (!trips.length) trips = [createTripEntry("旅程1")];
            activeTripId = trips.some((t) => t.id === parsed.activeTripId) ? parsed.activeTripId : trips[0].id;
            return;
          }
        } catch {
          trips = [];
        }
        const legacy = migrateLegacyTrip();
        trips = [legacy || createTripEntry("旅程1")];
        activeTripId = trips[0].id;
      }

      function getActiveTrip() {
        return trips.find((t) => t.id === activeTripId) || trips[0];
      }

      function applyActiveTripToState() {
        const trip = getActiveTrip();
        activeTripId = trip.id;
        state.days = trip.days;
        state.activeDayIndex = trip.activeDayIndex;
        state.tripName = trip.tripName;
        state.departure = trip.departure;
        state.arrival = trip.arrival;
        state.autoArrival = trip.autoArrival;
        state.openRouteMenuIndex = null;
        state.accommodationUpdateScope = "all";
        state.addLocationType = "spot";
        state.addAccommodationScope = "all";
      }

      function persistActiveTripFromState() {
        const trip = getActiveTrip();
        if (!trip) return;
        trip.days = state.days;
        trip.activeDayIndex = state.activeDayIndex;
        trip.tripName = state.tripName;
        trip.departure = state.departure;
        trip.arrival = state.arrival;
        trip.autoArrival = state.autoArrival;
      }

      function saveTrips() {
        persistActiveTripFromState();
        localStorage.setItem(TRIPS_STORAGE_KEY, JSON.stringify({ trips, activeTripId }));
      }

      function renderTripSwitcher() {
        tripSwitcherEl.innerHTML = "";
        trips.forEach((trip, index) => {
          const option = document.createElement("option");
          option.value = trip.id;
          option.textContent = trip.tripName && trip.tripName.trim() ? trip.tripName : `旅程${index + 1}`;
          tripSwitcherEl.appendChild(option);
        });
        tripSwitcherEl.value = activeTripId;
        const singleTrip = trips.length <= 1;
        tripDeleteBtnEl.disabled = singleTrip;
        tripDeleteBtnEl.classList.toggle("opacity-50", singleTrip);
        tripDeleteBtnEl.classList.toggle("cursor-not-allowed", singleTrip);
      }

      function loadState() {
        loadTrips();
        applyActiveTripToState();
      }

      function saveState() {
        saveTrips();
      }

      function syncAutoStarts() {
        for (let i = 1; i < state.days.length; i++) {
          const previousAccommodation = (state.days[i - 1].accommodation || "").trim();
          const day = state.days[i];
          if (day.autoAccommodation) {
            day.accommodation = previousAccommodation;
          }
          if (day.autoStart) {
            if (previousAccommodation) {
              if (day.autoStartSlot) {
                if (day.spots.length === 0) {
                  day.spots.unshift(previousAccommodation);
                  day.autoStartSlot = true;
                  day.autoStartValue = previousAccommodation;
                } else {
                  const currentFirst = (day.spots[0] || "").trim();
                  const managedValue = (day.autoStartValue || "").trim();
                  if (managedValue && currentFirst !== managedValue) {
                    day.autoStart = false;
                    day.autoStartSlot = false;
                    day.autoStartValue = "";
                  } else if (!managedValue && currentFirst) {
                    day.autoStart = false;
                    day.autoStartSlot = false;
                    day.autoStartValue = "";
                  } else {
                    day.spots[0] = previousAccommodation;
                    day.autoStartValue = previousAccommodation;
                  }
                }
              } else {
                day.spots.unshift(previousAccommodation);
                day.autoStartSlot = true;
                day.autoStartValue = previousAccommodation;
              }
            } else {
              const managedValue = (day.autoStartValue || "").trim();
              if (day.autoStartSlot && day.spots.length > 0 && ((day.spots[0] || "").trim() === managedValue || !managedValue)) {
                day.spots.shift();
              }
              day.autoStartSlot = false;
              day.autoStartValue = "";
            }
          }
        }
      }

      function openRoute(origin, destination, mapType) {
        const from = encodeURIComponent(origin.trim());
        const to = encodeURIComponent(destination.trim());
        const url =
          mapType === "apple"
            ? `https://maps.apple.com/?saddr=${from}&daddr=${to}`
            : `https://www.google.com/maps/dir/?api=1&origin=${from}&destination=${to}`;
        const mapWindow = window.open(url, "_blank");
        if (mapWindow) {
          mapWindow.opener = null;
        }
        if (!mapWindow) {
          window.location.assign(url);
        }
      }

      function getDayRouteUrl(locations) {
        const origin = encodeURIComponent(locations[0]);
        const destination = encodeURIComponent(locations[locations.length - 1]);
        const waypoints = locations.slice(1, -1).map(encodeURIComponent).join("%7C");
        return `https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${destination}${waypoints ? `&waypoints=${waypoints}` : ""}`;
      }

      function addSpot() {
        const value = newSpotInputEl.value.trim();
        if (!value) return;
        const day = state.days[state.activeDayIndex];
        if (state.addLocationType === "departure") {
          state.departure = value;
          state.arrival = value;
          state.autoArrival = true;
        } else if (state.addLocationType === "accommodation") {
          const nextDay = state.days[state.activeDayIndex + 1];
          day.accommodation = value;
          day.autoAccommodation = false;
          if (state.addAccommodationScope === "all") {
            for (let i = state.activeDayIndex + 1; i < state.days.length; i++) {
              state.days[i].autoAccommodation = true;
            }
          } else if (nextDay) {
            nextDay.accommodation = value;
            nextDay.autoAccommodation = false;
          }
          syncAutoStarts();
        } else {
          day.spots.push(value);
        }
        newSpotInputEl.value = "";
        saveState();
        render();
      }

      function setTagStyle(button, selected) {
        button.setAttribute("aria-pressed", String(selected));
        button.style.backgroundColor = selected ? "#0f766e" : "#ffffff";
        button.style.borderColor = selected ? "#0f766e" : "#cbd5e1";
        button.style.color = selected ? "#ffffff" : "#334155";
      }

      function renderAddSpotOptions() {
        addTargetDayEl.textContent = `+ ${state.days[state.activeDayIndex].name}`;
        addTargetDayEl.title = `${state.days[state.activeDayIndex].name} に追加`;
        setTagStyle(addTypeSpotEl, state.addLocationType === "spot");
        setTagStyle(addTypeDepartureEl, state.addLocationType === "departure");
        setTagStyle(addTypeAccommodationEl, state.addLocationType === "accommodation");
        addAccommodationScopeEl.classList.toggle("hidden", state.addLocationType !== "accommodation");
        const note =
          state.addLocationType === "departure"
            ? "到着地点は後から上書きできます。"
            : "";
        addTypeNoteEl.textContent = note;
        addTypeNoteEl.classList.toggle("hidden", !note);
        setTagStyle(addAccommodationScopeAllEl, state.addAccommodationScope === "all");
        setTagStyle(addAccommodationScopeTodayEl, state.addAccommodationScope === "today");
        newSpotInputEl.placeholder =
          state.addLocationType === "departure"
            ? "例: 東京駅"
            : state.addLocationType === "accommodation"
              ? "例: 京都駅周辺"
              : "例: 浅草寺";
      }

      function addDay() {
        const prevAccommodation = (state.days[state.days.length - 1].accommodation || "").trim();
        state.days.push(createDay(state.days.length + 1, prevAccommodation));
        state.activeDayIndex = state.days.length - 1;
        saveState();
        render();
        document.getElementById(`day-section-${state.activeDayIndex}`)?.scrollIntoView({ behavior: "smooth", block: "start" });
      }

      function deleteActiveDay() {
        if (state.days.length <= 1) return;

        state.days.splice(state.activeDayIndex, 1);
        state.days.forEach((day, index) => {
          day.name = `Day ${index + 1}`;
          if (index === 0 && day.autoStartSlot && (day.spots[0] || "").trim() === (day.autoStartValue || "").trim()) {
            day.spots.shift();
            day.autoStart = false;
            day.autoStartSlot = false;
            day.autoStartValue = "";
          }
          if (index === 0) {
            day.autoAccommodation = false;
          }
        });
        state.activeDayIndex = Math.min(state.activeDayIndex, state.days.length - 1);
        state.openRouteMenuIndex = null;
        syncAutoStarts();
        saveState();
        render();
      }

      function renderTabs() {
        dayTabsEl.innerHTML = "";
        state.days.forEach((day, index) => {
          const button = document.createElement("button");
          const active = index === state.activeDayIndex;
          button.className = `w-20 rounded-lg border px-3 py-2 text-center text-sm font-medium shadow-sm transition ${
            active ? "text-white" : "border-slate-300 bg-white text-slate-700 hover:border-slate-400"
          }`;
          if (active) {
            button.style.backgroundColor = "#0284c7";
            button.style.borderColor = "#0284c7";
            button.style.color = "#ffffff";
          }
          button.textContent = day.name;
          button.addEventListener("click", () => {
            state.activeDayIndex = index;
            state.openRouteMenuIndex = null;
            saveState();
            if (index === 0) {
              window.scrollTo({ top: 0, behavior: "smooth" });
              requestAnimationFrame(() => {
                state.activeDayIndex = 0;
                renderAddSpotOptions();
                renderTabs();
              });
            } else {
              document.getElementById(`day-section-${index}`)?.scrollIntoView({ behavior: "smooth", block: "start" });
            }
            renderTabs();
          });
          dayTabsEl.appendChild(button);
        });

        const addButton = document.createElement("button");
        addButton.type = "button";
        addButton.className =
          "flex h-9 w-9 items-center justify-center self-center rounded-full border border-dashed border-slate-400 bg-white p-0 text-lg font-semibold leading-none text-slate-700 transition hover:border-slate-600";
        const addIcon = document.createElement("span");
        addIcon.textContent = "+";
        addIcon.style.transform = "translateY(-1px)";
        addButton.appendChild(addIcon);
        addButton.setAttribute("aria-label", "日数追加");
        addButton.title = "日数追加";
        addButton.addEventListener("click", addDay);
        dayTabsEl.appendChild(addButton);

        const deleteButton = document.createElement("button");
        deleteButton.type = "button";
        deleteButton.className =
          "flex h-9 w-9 items-center justify-center self-center rounded-full border border-rose-200 bg-rose-50 p-0 text-lg font-semibold leading-none text-rose-700 transition hover:bg-rose-100 disabled:cursor-not-allowed disabled:opacity-50";
        const deleteIcon = document.createElement("span");
        deleteIcon.textContent = "−";
        deleteIcon.style.transform = "translateY(-1px)";
        deleteButton.appendChild(deleteIcon);
        deleteButton.setAttribute("aria-label", "日程を削除");
        deleteButton.title = "日程を削除";
        deleteButton.disabled = state.days.length <= 1;
        deleteButton.addEventListener("click", deleteActiveDay);
        dayTabsEl.appendChild(deleteButton);
      }

      function createSpotCard(spotValue, index, markerIndex = index, dayIndex = state.activeDayIndex) {
        const card = document.createElement("div");
        card.className = "relative rounded-xl border border-slate-200 bg-white p-3 shadow-sm sm:p-4";

        const row = document.createElement("div");
        row.className = "flex items-start gap-3";

        const marker = document.createElement("div");
        marker.className =
          "mt-2 flex h-6 w-6 shrink-0 items-center justify-center rounded-full bg-sky-600 text-xs font-bold text-white";
        marker.textContent = String(markerIndex + 1);

        const content = document.createElement("div");
        content.className = "w-full";

        const input = document.createElement("input");
        input.type = "text";
        input.value = spotValue;
        input.placeholder = "スポット名";
        input.className =
          "w-full rounded-lg border border-slate-300 px-3 py-2 text-sm outline-none transition focus:border-sky-400 focus:ring-2 focus:ring-sky-100";
        input.addEventListener("input", (e) => {
          const day = state.days[dayIndex];
          day.spots[index] = e.target.value;
          if (dayIndex > 0 && index === 0 && day.autoStartSlot) {
            const previousAccommodation = (state.days[dayIndex - 1].accommodation || "").trim();
            const currentValue = e.target.value.trim();
            const shouldKeepAuto = currentValue === previousAccommodation;
            day.autoStart = shouldKeepAuto;
            day.autoStartSlot = shouldKeepAuto && !!previousAccommodation;
            day.autoStartValue = shouldKeepAuto ? previousAccommodation : "";
          }
          saveState();
        });

        const controls = document.createElement("div");
        controls.className = "mt-2 flex items-center justify-between gap-2";

        const hint = document.createElement("span");
        hint.className = "text-xs text-slate-500";
        hint.textContent = dayIndex > 0 && index === 0 && state.days[dayIndex].autoStart ? "前日の宿泊地を反映中" : "";

        const removeBtn = document.createElement("button");
        removeBtn.type = "button";
        removeBtn.className = "rounded-md bg-rose-50 px-2 py-1 text-xs font-medium text-rose-700 hover:bg-rose-100";
        removeBtn.textContent = "削除";
        removeBtn.addEventListener("click", () => {
          const day = state.days[dayIndex];
          day.spots.splice(index, 1);
          if (index === 0 && dayIndex > 0) {
            day.autoStart = false;
            day.autoStartSlot = false;
            day.autoStartValue = "";
          }
          state.openRouteMenuIndex = null;
          saveState();
          render();
        });

        controls.append(hint, removeBtn);
        content.append(input, controls);
        row.append(marker, content);
        card.appendChild(row);
        return card;
      }

      function createAccommodationCard(accommodation, index) {
        const card = document.createElement("div");
        card.className = "rounded-xl border border-green-200 bg-green-50 p-3 shadow-sm sm:p-4";

        const row = document.createElement("div");
        row.className = "flex items-start gap-3";

        const marker = document.createElement("div");
        marker.className = "mt-2 flex h-6 w-6 shrink-0 items-center justify-center rounded-full bg-green-600 text-xs font-bold text-white";
        marker.textContent = String(index + 1);

        const content = document.createElement("div");
        content.className = "w-full";

        const label = document.createElement("p");
        label.className = "text-xs font-medium text-green-700";
        label.textContent = "宿泊地";

        const name = document.createElement("p");
        name.className = "mt-1 text-sm font-medium text-slate-900";
        name.textContent = accommodation;

        content.append(label, name);
        row.append(marker, content);
        card.appendChild(row);
        return card;
      }

      function createEndpointCard(location, index, label) {
        const card = document.createElement("div");
        card.className = "rounded-xl border border-violet-200 bg-violet-50 p-3 shadow-sm sm:p-4";

        const row = document.createElement("div");
        row.className = "flex items-start gap-3";

        const marker = document.createElement("div");
        marker.className = "mt-2 flex h-6 w-6 shrink-0 items-center justify-center rounded-full bg-violet-600 text-xs font-bold text-white";
        marker.textContent = String(index + 1);

        const content = document.createElement("div");
        content.className = "w-full";

        const locationLabel = document.createElement("p");
        locationLabel.className = "text-xs font-medium text-violet-700";
        locationLabel.textContent = label;

        const name = document.createElement(label === "到着地点" ? "input" : "p");
        name.className =
          label === "到着地点"
            ? "mt-1 w-full rounded-lg border border-violet-300 bg-white px-3 py-2 text-sm font-medium text-slate-900 outline-none transition focus:border-violet-500 focus:ring-2 focus:ring-violet-100"
            : "mt-1 text-sm font-medium text-slate-900";
        if (label === "到着地点") {
          name.type = "text";
          name.value = location;
          name.placeholder = "到着地点を入力";
          name.addEventListener("input", (e) => {
            state.arrival = e.target.value;
            state.autoArrival = false;
            saveState();
          });
        } else {
          name.textContent = location;
        }

        content.append(locationLabel, name);
        row.append(marker, content);
        card.appendChild(row);
        return card;
      }

      function createRouteConnector(from, to, routeIndex, dayIndex = state.activeDayIndex) {
        const wrap = document.createElement("div");
        wrap.className = "flex flex-col items-center py-2";

        const line = document.createElement("div");
        line.className = "h-5 w-px bg-slate-300";

        const btn = document.createElement("button");
        btn.type = "button";
        const menuId = `route-menu-${dayIndex}-${routeIndex}`;
        btn.className =
          "rounded-full border border-sky-300 bg-sky-50 px-3 py-1 text-xs font-medium text-sky-700 transition hover:bg-sky-100";
        btn.textContent = "ルート検索";
        btn.setAttribute("aria-controls", menuId);
        btn.setAttribute("aria-expanded", String(state.openRouteMenuIndex === `${dayIndex}-${routeIndex}`));
        btn.addEventListener("click", () => {
          const menuKey = `${dayIndex}-${routeIndex}`;
          state.openRouteMenuIndex = state.openRouteMenuIndex === menuKey ? null : menuKey;
          render();
        });

        const menu = document.createElement("div");
        menu.id = menuId;
        menu.className = `mt-2 flex gap-2 ${state.openRouteMenuIndex === `${dayIndex}-${routeIndex}` ? "" : "hidden"}`;
        menu.setAttribute("role", "menu");
        menu.setAttribute("aria-label", "地図アプリ選択");
        menu.addEventListener("keydown", (event) => {
          if (event.key === "Escape") {
            event.preventDefault();
            state.openRouteMenuIndex = null;
            render();
            btn.focus();
          }
        });

        const feedback = document.createElement("p");
        feedback.id = `${menuId}-feedback`;
        feedback.className = "mt-2 text-xs text-rose-600";
        feedback.setAttribute("aria-live", "polite");

        function showRouteValidation() {
          feedback.textContent = "前後の地点名を入力してください。";
        }

        const googleBtn = document.createElement("button");
        googleBtn.type = "button";
        googleBtn.className = "rounded-md bg-white px-3 py-1 text-xs font-medium text-slate-700 ring-1 ring-slate-300 hover:bg-slate-50";
        googleBtn.textContent = "Google マップ";
        googleBtn.setAttribute("role", "menuitem");
        googleBtn.setAttribute("aria-describedby", feedback.id);
        googleBtn.addEventListener("click", () => {
          if (!from.trim() || !to.trim()) {
            showRouteValidation();
            return;
          }
          feedback.textContent = "";
          openRoute(from, to, "google");
        });

        const appleBtn = document.createElement("button");
        appleBtn.type = "button";
        appleBtn.className = "rounded-md bg-white px-3 py-1 text-xs font-medium text-slate-700 ring-1 ring-slate-300 hover:bg-slate-50";
        appleBtn.textContent = "Apple マップ";
        appleBtn.setAttribute("role", "menuitem");
        appleBtn.setAttribute("aria-describedby", feedback.id);
        appleBtn.addEventListener("click", () => {
          if (!from.trim() || !to.trim()) {
            showRouteValidation();
            return;
          }
          feedback.textContent = "";
          openRoute(from, to, "apple");
        });

        menu.append(googleBtn, appleBtn);
        wrap.append(line, btn, menu, feedback);
        return wrap;
      }

      function createDayTimeline(day, dayIndex) {
        const section = document.createElement("section");
        section.id = `day-section-${dayIndex}`;
        section.dataset.dayIndex = String(dayIndex);
        section.className = "scroll-mt-4 border-t border-slate-200 py-6 first:border-t-0 first:pt-0";

        const heading = document.createElement("h2");
        heading.className = "text-lg font-bold text-slate-800";
        heading.textContent = day.name;

        const isFirstDay = dayIndex === 0;
        const isLastDay = dayIndex === state.days.length - 1;
        const departure = isFirstDay ? state.departure.trim() : "";
        const arrival = isLastDay ? state.arrival.trim() : "";
        const accommodation = day.accommodation.trim();
        const items = [];

        if (departure) {
          items.push({ type: "endpoint", value: departure, label: "出発地点" });
        }
        day.spots.forEach((spot, index) => {
          items.push({ type: "spot", value: spot, spotIndex: index });
        });
        if (accommodation) {
          items.push({ type: "accommodation", value: accommodation });
        }
        if (arrival) {
          items.push({ type: "endpoint", value: arrival, label: "到着地点" });
        }

        const sectionHeader = document.createElement("div");
        sectionHeader.className = "mb-4 flex items-center justify-between gap-3";

        const routeButton = document.createElement(items.length < 2 ? "button" : "a");
        routeButton.className =
          "shrink-0 rounded-lg border border-sky-300 bg-sky-50 px-3 py-2 text-xs font-semibold text-sky-700 transition hover:bg-sky-100 disabled:cursor-not-allowed disabled:opacity-50";
        routeButton.textContent = "この日のルート";
        routeButton.title = "Google マップでこの日のルートを開く";
        if (items.length < 2) {
          routeButton.type = "button";
          routeButton.disabled = true;
        } else {
          routeButton.href = getDayRouteUrl(items.map((item) => item.value));
          routeButton.target = "_blank";
          routeButton.rel = "noopener noreferrer";
        }

        sectionHeader.append(heading, routeButton);
        section.appendChild(sectionHeader);

        if (items.length === 0) {
          const empty = document.createElement("p");
          empty.className = "rounded-xl border border-dashed border-slate-300 bg-slate-50 p-4 text-sm text-slate-500";
          empty.textContent = "まだスポットがありません。上の入力から追加してください。";
          section.appendChild(empty);
          return section;
        }

        items.forEach((item, index) => {
          if (item.type === "spot") {
            section.appendChild(createSpotCard(item.value, item.spotIndex, index, dayIndex));
          } else if (item.type === "accommodation") {
            section.appendChild(createAccommodationCard(item.value, index));
          } else {
            section.appendChild(createEndpointCard(item.value, index, item.label));
          }
          if (index < items.length - 1) {
            section.appendChild(createRouteConnector(item.value, items[index + 1].value, index, dayIndex));
          }
        });
        return section;
      }

      function renderTimeline() {
        timelineEl.innerHTML = "";
        state.days.forEach((day, index) => {
          timelineEl.appendChild(createDayTimeline(day, index));
        });
      }

      function renderEndpoints() {
        const isLastDay = state.activeDayIndex === state.days.length - 1;
        endpointSectionEl.classList.add("hidden");
        departureFieldEl.classList.add("hidden");
        departureInputEl.value = state.departure;
        accommodationSectionEl.classList.add("hidden");
      }

      function renderAccommodation() {
        const day = state.days[state.activeDayIndex];
        accommodationInputEl.value = day.accommodation;
        const allDays = state.accommodationUpdateScope === "all";
        accommodationScopeAllEl.setAttribute("aria-pressed", String(allDays));
        accommodationScopeNextDayEl.setAttribute("aria-pressed", String(!allDays));
        accommodationScopeAllEl.style.backgroundColor = allDays ? "#0f766e" : "#ffffff";
        accommodationScopeAllEl.style.borderColor = allDays ? "#0f766e" : "#cbd5e1";
        accommodationScopeAllEl.style.color = allDays ? "#ffffff" : "#334155";
        accommodationScopeNextDayEl.style.backgroundColor = allDays ? "#ffffff" : "#0f766e";
        accommodationScopeNextDayEl.style.borderColor = allDays ? "#cbd5e1" : "#0f766e";
        accommodationScopeNextDayEl.style.color = allDays ? "#334155" : "#ffffff";
      }

      function updateActiveDayFromScroll() {
        const sections = [...document.querySelectorAll("[data-day-index]")];
        if (sections.length === 0) return;
        const isAtBottom = window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 2;
        const closestSection = sections.reduce((closest, section) =>
          Math.abs(section.getBoundingClientRect().top) < Math.abs(closest.getBoundingClientRect().top) ? section : closest
        );
        const dayIndex = isAtBottom ? state.days.length - 1 : Number(closestSection.dataset.dayIndex);
        if (dayIndex !== state.activeDayIndex) {
          state.activeDayIndex = dayIndex;
          renderAddSpotOptions();
          renderTabs();
        }
      }

      function render() {
        ensureValidState();
        syncAutoStarts();
        if (state.autoArrival) {
          state.arrival = state.departure;
        }
        tripNameInputEl.value = state.tripName;
        renderTripSwitcher();
        renderTabs();
        renderAddSpotOptions();
        renderTimeline();
        renderEndpoints();
        renderAccommodation();
      }

      addSpotFormEl.addEventListener("submit", (e) => {
        e.preventDefault();
        addSpot();
      });

      tripNameInputEl.addEventListener("input", (e) => {
        state.tripName = e.target.value;
        saveState();
        const activeOption = tripSwitcherEl.querySelector(`option[value="${activeTripId}"]`);
        if (activeOption) {
          const index = trips.findIndex((t) => t.id === activeTripId);
          activeOption.textContent = state.tripName.trim() ? state.tripName : `旅程${index + 1}`;
        }
      });

      tripSwitcherEl.addEventListener("change", (e) => {
        saveTrips();
        activeTripId = e.target.value;
        applyActiveTripToState();
        saveTrips();
        render();
      });

      tripNewBtnEl.addEventListener("click", () => {
        if (trips.length >= MAX_TRIPS) {
          alert(`旅程は最大${MAX_TRIPS}件までしか作成できません。`);
          return;
        }
        saveTrips();
        const newTrip = createTripEntry(`旅程${trips.length + 1}`);
        trips.push(newTrip);
        activeTripId = newTrip.id;
        applyActiveTripToState();
        saveTrips();
        render();
      });

      tripDeleteBtnEl.addEventListener("click", () => {
        if (trips.length <= 1) {
          alert("最後の1件の旅程は削除できません。");
          return;
        }
        if (!confirm("現在の旅程を削除しますか？この操作は取り消せません。")) return;
        const index = trips.findIndex((t) => t.id === activeTripId);
        trips.splice(index, 1);
        activeTripId = trips[Math.max(0, index - 1)].id;
        applyActiveTripToState();
        saveTrips();
        render();
      });

      addTypeSpotEl.addEventListener("click", () => {
        state.addLocationType = "spot";
        renderAddSpotOptions();
      });

      addTypeDepartureEl.addEventListener("click", () => {
        state.addLocationType = "departure";
        renderAddSpotOptions();
      });

      addTypeAccommodationEl.addEventListener("click", () => {
        state.addLocationType = "accommodation";
        renderAddSpotOptions();
      });

      addAccommodationScopeAllEl.addEventListener("click", () => {
        state.addAccommodationScope = "all";
        renderAddSpotOptions();
      });

      addAccommodationScopeTodayEl.addEventListener("click", () => {
        state.addAccommodationScope = "today";
        renderAddSpotOptions();
      });

      function flushAccommodationSync(shouldRender = true, sourceDayIndex, sourceValue) {
        const hasExplicitSource = sourceDayIndex !== undefined && sourceValue !== undefined;
        if (!hasExplicitSource && pendingAccommodationSync) {
          sourceDayIndex = pendingAccommodationSync.dayIndex;
          sourceValue = pendingAccommodationSync.value;
        }
        if (sourceDayIndex === undefined) sourceDayIndex = state.activeDayIndex;
        if (sourceValue === undefined) sourceValue = accommodationInputEl.value;
        if (accommodationDebounceId) {
          clearTimeout(accommodationDebounceId);
          accommodationDebounceId = null;
        }
        pendingAccommodationSync = null;
        if (state.days[sourceDayIndex]) {
          state.days[sourceDayIndex].accommodation = sourceValue;
        }
        syncAutoStarts();
        saveState();
        if (shouldRender) {
          render();
        }
      }

      function scheduleAccommodationSync(dayIndex, accommodationValue) {
        if (accommodationDebounceId) {
          clearTimeout(accommodationDebounceId);
        }
        pendingAccommodationSync = { dayIndex, value: accommodationValue };
        accommodationDebounceId = setTimeout(() => {
          if (pendingAccommodationSync && state.days[pendingAccommodationSync.dayIndex]) {
            state.days[pendingAccommodationSync.dayIndex].accommodation = pendingAccommodationSync.value;
          }
          accommodationDebounceId = null;
          pendingAccommodationSync = null;
          syncAutoStarts();
          saveState();
          if (state.activeDayIndex === dayIndex) {
            render();
          }
        }, 180);
      }

      accommodationInputEl.addEventListener("input", (e) => {
        const dayIndex = state.activeDayIndex;
        const day = state.days[dayIndex];
        const nextNextDay = state.days[dayIndex + 2];
        const nextNextAccommodation = nextNextDay ? nextNextDay.accommodation : "";
        day.accommodation = e.target.value;
        day.autoAccommodation = false;

        if (state.accommodationUpdateScope === "all") {
          for (let i = dayIndex + 1; i < state.days.length; i++) {
            state.days[i].autoAccommodation = true;
          }
        } else {
          const nextDay = state.days[dayIndex + 1];
          if (nextDay) {
            nextDay.autoAccommodation = true;
          }
          if (nextNextDay) {
            nextNextDay.accommodation = nextNextAccommodation;
            nextNextDay.autoAccommodation = false;
          }
        }
        syncAutoStarts();
        saveState();
        scheduleAccommodationSync(state.activeDayIndex, e.target.value);
      });

      departureInputEl.addEventListener("input", (e) => {
        state.departure = e.target.value;
        state.arrival = e.target.value;
        state.autoArrival = true;
        saveState();
        renderTimeline();
      });

      accommodationScopeAllEl.addEventListener("click", () => {
        state.accommodationUpdateScope = "all";
        renderAccommodation();
      });

      accommodationScopeNextDayEl.addEventListener("click", () => {
        state.accommodationUpdateScope = "next-day";
        renderAccommodation();
      });

      accommodationInputEl.addEventListener("blur", () => {
        flushAccommodationSync(true, state.activeDayIndex, accommodationInputEl.value);
      });

      window.addEventListener("scroll", updateActiveDayFromScroll, { passive: true });

      loadState();
      ensureValidState();
      syncAutoStarts();
      saveState();
      render();
    </script>
  </body>
</html>
