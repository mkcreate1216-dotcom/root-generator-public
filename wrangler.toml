name = "root-generator-public"
compatibility_date = "2024-09-19"
compatibility_flags = ["nodejs_compat"]

main = "./dist/_worker.js/index.js"

[assets]
directory = "./dist"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "tabirome-db"
database_id = "ac767fff-28ce-4a23-b81f-f87259ef97c9"

[observability]
enabled = true

  [observability.logs]
  head_sampling_rate = 1

  [observability.traces]
  enabled = true
  head_sampling_rate = 0.01

